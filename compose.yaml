services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: noorpath
      POSTGRES_USER: noorpath
      POSTGRES_PASSWORD: ${NOORPATH_DB_PASSWORD:?Set NOORPATH_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noorpath -d noorpath"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - noorpath-postgres:/var/lib/postgresql

volumes:
  noorpath-postgres:
