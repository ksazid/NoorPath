name: VS-16 Link Journey

on:
  push:
    branches:
      - codex/vs16-cancellation-refunds-runtime

permissions:
  contents: write

jobs:
  link:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vs16-cancellation-refunds-runtime
          fetch-depth: 0
      - name: Link cancellation into My Journey
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('apps/api/MyJourneyEndpoints.cs')
          text = api.read_text()
          list_old = 'item.AccountId == principal.AccountId.Value && item.State == BookingState.Confirmed)'
          list_new = 'item.AccountId == principal.AccountId.Value\n                && (item.State == BookingState.Confirmed || item.State == BookingState.Cancelled))'
          detail_old = 'item => item.Id == bookingId && item.AccountId == accountId && item.State == BookingState.Confirmed,'
          detail_new = 'item => item.Id == bookingId\n                    && item.AccountId == accountId\n                    && (item.State == BookingState.Confirmed || item.State == BookingState.Cancelled),'
          if list_old not in text or detail_old not in text:
              raise SystemExit('My Journey predicates no longer match expected source')
          api.write_text(text.replace(list_old, list_new).replace(detail_old, detail_new))

          page = Path('apps/web/app/bookings/[bookingId]/journey/page.tsx')
          text = page.read_text()
          import_anchor = 'import { Icon, PublicFooter, PublicHeader } from "../../../public-ui";\n'
          import_line = 'import { CancellationPanel } from "./CancellationPanel";\n'
          panel_anchor = '      <section className="journey-panel">\n        <p className="public-eyebrow">Travel readiness</p>'
          panel_insert = '      <CancellationPanel bookingId={j.bookingId} />\n      <section className="journey-panel">\n        <p className="public-eyebrow">Travel readiness</p>'
          if import_anchor not in text or panel_anchor not in text:
              raise SystemExit('Journey page no longer matches expected source')
          page.write_text(text.replace(import_anchor, import_anchor + import_line).replace(panel_anchor, panel_insert))
          PY
      - name: Commit linked journey
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/MyJourneyEndpoints.cs apps/web/app/bookings/'[bookingId]'/journey/page.tsx
          git commit -m "VS-16: link cancellation into My Journey"
          git push origin HEAD:codex/vs16-cancellation-refunds-runtime
