name: VS-36 Manifest Formatter One-shot

on:
  push:
    branches:
      - agent/vs36-package-details-design-correction

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs36-package-details-design-correction
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec prettier --write '../../delivery/slices/VS-36.json'
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add delivery/slices/VS-36.json
          git commit -m 'VS-36 format slice manifest'
          git push origin HEAD:agent/vs36-package-details-design-correction
