name: VS-09 Integration Check

on:
  pull_request:
    branches: [main]
    types: [edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integration:
    if: >-
      github.head_ref == 'agent/vs09-booking-payment' &&
      contains(github.event.pull_request.body, '<!-- run-vs09-integration -->')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: noorpath_commercial_test
          POSTGRES_USER: noorpath
          POSTGRES_PASSWORD: ci-local-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noorpath -d noorpath_commercial_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__NoorPath: Host=localhost;Port=5432;Database=noorpath_commercial_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_COMMERCIAL_TEST_DB: Host=localhost;Port=5432;Database=noorpath_commercial_test;Username=noorpath;Password=ci-local-only-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs09-booking-payment
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Apply exact payment replay ordering fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/PaymentEndpoints.cs")
          text = path.read_text()
          if "var replayByKey" not in text:
              duplicate = '''        var idempotencyKeyHash = CheckoutIdempotency.Hash(idempotencyKey!);
                  var requestFingerprint = CheckoutIdempotency.Hash(
                      $"{accountId}\\n{booking.BookingId:D}\\n{booking.Currency}\\n{booking.DueNow:0.00}");

                  PaymentAttemptRecord? attempt;'''
              replacement = '''        PaymentAttemptRecord? attempt;'''
              if duplicate not in text:
                  raise SystemExit("Unable to locate the existing payment fingerprint block")
              text = text.replace(duplicate, replacement, 1)

              anchor = '''        if (booking.State == BookingState.PaymentSucceeded)
                      return PaymentAlreadySettled(http);'''
              insertion = '''        var idempotencyKeyHash = CheckoutIdempotency.Hash(idempotencyKey!);
                  var requestFingerprint = CheckoutIdempotency.Hash(
                      $"{accountId}\\n{booking.BookingId:D}\\n{booking.Currency}\\n{booking.DueNow:0.00}");
                  var replayByKey = await payments.PaymentAttempts.AsNoTracking()
                      .SingleOrDefaultAsync(item =>
                          item.AccountId == accountId
                          && item.IdempotencyKeyHash == idempotencyKeyHash,
                          cancellationToken);
                  if (replayByKey is not null)
                  {
                      if (!string.Equals(
                              replayByKey.RequestFingerprint,
                              requestFingerprint,
                              StringComparison.Ordinal))
                      {
                          return IdempotencyConflict(http);
                      }

                      if (replayByKey.State != PaymentAttemptState.Created)
                          return Results.Ok(ToResponse(replayByKey, razorpay.Value));
                  }

          '''
              if anchor not in text:
                  raise SystemExit("Unable to locate the booking payment-state gate")
              text = text.replace(anchor, insertion + anchor, 1)
              path.write_text(text)
          PY
      - name: Restore and format
        run: |
          dotnet restore NoorPath.slnx
          dotnet format NoorPath.slnx --no-restore
      - name: Build solution
        run: dotnet build NoorPath.slnx --configuration Release --no-restore
      - name: Run VS-09 API integration tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/vs09
          dotnet test tests/NoorPath.Commercial.Integration.Tests/NoorPath.Commercial.Integration.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter FullyQualifiedName~BookingPaymentApiTests \
            --logger "trx;LogFileName=vs09-integration.trx" \
            --results-directory test-results/vs09 \
            --logger "console;verbosity=detailed" 2>&1 | tee test-results/vs09/console.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs09-integration-diagnostics
          retention-days: 1
          if-no-files-found: error
          path: test-results/vs09
      - name: Commit validated fix and formatting
        run: |
          if git diff --quiet; then
            echo "No implementation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api src tests NoorPath.slnx delivery/modules.json
          git commit -m "fix(vs09): resolve payment replay before state gate"
          git push origin HEAD:agent/vs09-booking-payment
