name: Format operator navigation

on:
  push:
    branches: [fix/operator-navigation]
    paths:
      - "apps/web/app/operator/OperatorCollectionPage.tsx"
      - "apps/web/app/operator/OperatorOverview.tsx"
      - "apps/web/app/operator/OperatorWorkspaceShell.tsx"
      - ".github/workflows/format-operator-navigation.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operator-navigation
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format operator files
        run: >-
          pnpm --dir apps/web exec prettier --write
          app/operator/OperatorCollectionPage.tsx
          app/operator/OperatorOverview.tsx
          app/operator/OperatorWorkspaceShell.tsx
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/operator/OperatorCollectionPage.tsx \
            apps/web/app/operator/OperatorOverview.tsx \
            apps/web/app/operator/OperatorWorkspaceShell.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git commit -m "Format operator workspace"
          git push origin HEAD:fix/operator-navigation
