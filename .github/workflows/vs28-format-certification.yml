name: VS-28 format certification

on:
  push:
    branches:
      - slice/vs28-final-departure-handover-readiness
    paths:
      - .github/workflows/vs28-format-certification.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/vs28-final-departure-handover-readiness
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format VS-28 rendered test
        run: |
          pnpm --dir apps/web exec prettier --write \
            e2e/operator-departure-handover.spec.ts
          rm .github/workflows/vs28-format-certification.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/operator-departure-handover.spec.ts \
            .github/workflows/vs28-format-certification.yml
          git commit -m "VS-28: apply exact Prettier output"
          git push origin HEAD:slice/vs28-final-departure-handover-readiness