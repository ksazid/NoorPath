name: VS-36 One-shot Test Formatter

on:
  push:
    branches:
      - agent/vs36-package-details-design-correction

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs36-package-details-design-correction
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format Package Details test
        run: pnpm --dir apps/web exec prettier --write 'e2e/package-details.spec.ts'
      - name: Commit formatted test
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/web/e2e/package-details.spec.ts'
          git commit -m 'VS-36 format package details test'
          git push origin HEAD:agent/vs36-package-details-design-correction
