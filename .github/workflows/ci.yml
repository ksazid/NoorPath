# Temporary VS-03 lint repair job; restore verify-only CI after its bot commit.
# Triggered after the preceding validation run completed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  fix-vs03-lint:
    name: Fix VS-03 lint
    if: github.event_name == 'pull_request' && github.head_ref == 'vs03/pricing-inventory' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Remove redundant effect state writes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/app/operator/departures/CommercialEditor.tsx")
          text = path.read_text()
          old = '''    if (!departureId) {
      setLoadState("ready");
      onDirtyChange(false);
      onBusyChange(false);
      return;
    }
'''
          new = '''    if (!departureId) return;
'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one redundant effect block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format commercial editor
        run: pnpm --dir apps/web exec prettier --write app/operator/departures/CommercialEditor.tsx
      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/operator/departures/CommercialEditor.tsx
          git commit -m "Fix VS-03 commercial load effect"
          git push origin HEAD:${{ github.head_ref }}

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    # Only run on push or on PRs from the same repository (skip fork PRs)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
        contents: read
        checks: write
        pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  node:
    name: Node validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  dotnet:
    name: .NET validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: noorpath_test
          POSTGRES_USER: noorpath
          POSTGRES_PASSWORD: ci-local-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noorpath -d noorpath_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOORPATH_TEST_DB: Host=localhost;Port=5432;Database=noorpath_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_CATALOGUE_TEST_DB: Host=localhost;Port=5432;Database=noorpath_catalogue_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_OPERATORS_TEST_DB: Host=localhost;Port=5432;Database=noorpath_operators_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_PRICING_TEST_DB: Host=localhost;Port=5432;Database=noorpath_pricing_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_INVENTORY_TEST_DB: Host=localhost;Port=5432;Database=noorpath_inventory_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_COMMERCIAL_TEST_DB: Host=localhost;Port=5432;Database=noorpath_commercial_test;Username=noorpath;Password=ci-local-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - run: dotnet restore NoorPath.slnx
      - run: dotnet format NoorPath.slnx --verify-no-changes --no-restore
      - run: dotnet build NoorPath.slnx --configuration Release --no-restore

      - name: Create module test databases
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="$(docker ps --filter "publish=5432" --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_catalogue_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_operators_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_pricing_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_inventory_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_commercial_test;'

      - name: Validate Catalogue migration state
        run: ./scripts/validate-catalogue-migrations.sh
      - name: Validate Operators migration state
        run: ./scripts/validate-operators-migrations.sh
      - name: Validate Pricing migration state
        run: bash ./scripts/validate-pricing-migrations.sh
      - name: Validate Inventory migration state
        run: bash ./scripts/validate-inventory-migrations.sh

      - run: dotnet test NoorPath.slnx --configuration Release --no-build

  postgres:
    name: PostgreSQL configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOORPATH_DB_PASSWORD: ci-local-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Ensure clean PostgreSQL data
        run: docker compose down --volumes --remove-orphans || true
      - name: Start PostgreSQL and wait for health
        run: docker compose up -d --wait postgres
      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Clean up PostgreSQL
        if: always()
        run: docker compose down --volumes --remove-orphans
