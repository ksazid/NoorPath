name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    # Only run on push or on PRs from the same repository (skip fork PRs)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
        contents: read
        checks: write
        pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  node:
    name: Node validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Normalize VS-07 customer flow
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, marker: str) -> None:
              p = Path(path)
              text = p.read_text()
              if marker in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected source not found in {path}: {marker}")
              p.write_text(text.replace(old, new, 1))

          plan = "apps/web/app/packages/[departureId]/plan/page.tsx"
          p = Path(plan)
          text = p.read_text()
          text = text.replace(
              'import { FormEvent, useCallback, useEffect, useMemo, useState } from "react";',
              'import { FormEvent, useCallback, useEffect, useState } from "react";',
          )
          p.write_text(text)

          replace_once(
              plan,
              '''  useEffect(() => {\n    void loadPackage();\n    void loadTravellers();\n  }, [loadPackage, loadTravellers]);''',
              '''  useEffect(() => {\n    const pending = window.setTimeout(() => {\n      void loadPackage();\n      void loadTravellers();\n    }, 0);\n    return () => window.clearTimeout(pending);\n  }, [loadPackage, loadTravellers]);''',
              'void loadPackage();\n      void loadTravellers();\n    }, 0);',
          )

          replace_once(
              plan,
              '''    if (remaining <= 0) {\n      setQuoteState({\n        kind: "loaded",\n        quote: { ...quoteState.quote, expired: true },\n      });\n      return;\n    }\n\n    const timer = window.setTimeout(() => {''',
              '''    const delay = Math.max(remaining, 0);\n\n    const timer = window.setTimeout(() => {''',
              'const delay = Math.max(remaining, 0);',
          )
          p = Path(plan)
          text = p.read_text()
          text = text.replace('''    }, remaining);\n    return () => window.clearTimeout(timer);''', '''    }, delay);\n    return () => window.clearTimeout(timer);''', 1)
          p.write_text(text)

          package_page = "apps/web/app/packages/[departureId]/page.tsx"
          replace_once(
              package_page,
              '''      <p className="package-pricing-note">\n        Published occupancy pricing. No payment is taken on this page.\n      </p>\n      <a href="mailto:support@noorpath.example">''',
              '''      <p className="package-pricing-note">\n        Published occupancy pricing. No payment is taken on this page.\n      </p>\n      <Link\n        className="package-plan-primary"\n        href={`/packages/${details.departureId}/plan`}\n      >\n        Plan this journey <span aria-hidden="true">›</span>\n      </Link>\n      <a href="mailto:support@noorpath.example">''',
              'className="package-plan-primary"',
          )

          composer = "apps/web/app/operator/departures/DepartureComposer.tsx"
          replace_once(
              composer,
              'import CommercialEditor from "./CommercialEditor";',
              'import CommercialEditor from "./CommercialEditor";\nimport PaymentPlanEditor from "./PaymentPlanEditor";',
              'import PaymentPlanEditor from "./PaymentPlanEditor";',
          )
          replace_once(
              composer,
              '''  const [commercialDirty, setCommercialDirty] = useState(false);\n  const [commercialBusy, setCommercialBusy] = useState(false);\n  const hasUnsavedChanges = isDirty || commercialDirty;''',
              '''  const [commercialDirty, setCommercialDirty] = useState(false);\n  const [commercialBusy, setCommercialBusy] = useState(false);\n  const [paymentPlanDirty, setPaymentPlanDirty] = useState(false);\n  const [paymentPlanBusy, setPaymentPlanBusy] = useState(false);\n  const hasUnsavedChanges = isDirty || commercialDirty || paymentPlanDirty;''',
              'const [paymentPlanDirty, setPaymentPlanDirty]',
          )
          p = Path(composer)
          text = p.read_text()
          text = text.replace(
              'if (state === "saving" || commercialBusy) {',
              'if (state === "saving" || commercialBusy || paymentPlanBusy) {',
              1,
          )
          text = text.replace(
              'aria-busy={state === "saving" || commercialBusy}',
              'aria-busy={state === "saving" || commercialBusy || paymentPlanBusy}',
              1,
          )
          p.write_text(text)
          replace_once(
              composer,
              '''        ) : (\n          <CommercialEditor\n            departureId={departureId || undefined}\n            onDirtyChange={setCommercialDirty}\n            onBusyChange={setCommercialBusy}\n          />\n        )}''',
              '''        ) : (\n          <>\n            <CommercialEditor\n              departureId={departureId || undefined}\n              onDirtyChange={setCommercialDirty}\n              onBusyChange={setCommercialBusy}\n            />\n            <PaymentPlanEditor\n              departureId={departureId || undefined}\n              onDirtyChange={setPaymentPlanDirty}\n              onBusyChange={setPaymentPlanBusy}\n            />\n          </>\n        )}''',
              '<PaymentPlanEditor',
          )
          PY

          pnpm --dir apps/web exec prettier --write \
            'app/packages/[departureId]/plan/page.tsx' \
            'app/packages/[departureId]/page.tsx' \
            'app/operator/departures/DepartureComposer.tsx' \
            'app/operator/departures/PaymentPlanEditor.tsx'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'apps/web/app/packages/[departureId]/plan/page.tsx' \
            'apps/web/app/packages/[departureId]/page.tsx' \
            'apps/web/app/operator/departures/DepartureComposer.tsx' \
            'apps/web/app/operator/departures/PaymentPlanEditor.tsx'
          if ! git diff --cached --quiet; then
            git commit -m 'chore(vs07): normalize customer flow wiring'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  dotnet:
    name: .NET validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: noorpath_test
          POSTGRES_USER: noorpath
          POSTGRES_PASSWORD: ci-local-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noorpath -d noorpath_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOORPATH_TEST_DB: Host=localhost;Port=5432;Database=noorpath_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_CATALOGUE_TEST_DB: Host=localhost;Port=5432;Database=noorpath_catalogue_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_OPERATORS_TEST_DB: Host=localhost;Port=5432;Database=noorpath_operators_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_PRICING_TEST_DB: Host=localhost;Port=5432;Database=noorpath_pricing_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_INVENTORY_TEST_DB: Host=localhost;Port=5432;Database=noorpath_inventory_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_TRAVELLER_TEST_DB: Host=localhost;Port=5432;Database=noorpath_traveller_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_COMMERCIAL_TEST_DB: Host=localhost;Port=5432;Database=noorpath_commercial_test;Username=noorpath;Password=ci-local-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - run: dotnet restore NoorPath.slnx
      - run: dotnet format NoorPath.slnx --verify-no-changes --no-restore
      - run: dotnet build NoorPath.slnx --configuration Release --no-restore

      - name: Create module test databases
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="$(docker ps --filter "publish=5432" --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_catalogue_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_operators_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_pricing_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_inventory_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_traveller_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_commercial_test;'

      - name: Validate Catalogue migration state
        run: ./scripts/validate-catalogue-migrations.sh
      - name: Validate Operators migration state
        run: ./scripts/validate-operators-migrations.sh
      - name: Validate Pricing migration state
        run: bash ./scripts/validate-pricing-migrations.sh
      - name: Validate Inventory migration state
        run: bash ./scripts/validate-inventory-migrations.sh
      - name: Validate Traveller migration state
        run: bash ./scripts/validate-traveller-migrations.sh

      - run: dotnet test NoorPath.slnx --configuration Release --no-build

  postgres:
    name: PostgreSQL configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOORPATH_DB_PASSWORD: ci-local-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Ensure clean PostgreSQL data
        run: docker compose down --volumes --remove-orphans || true
      - name: Start PostgreSQL and wait for health
        run: docker compose up -d --wait postgres
      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Clean up PostgreSQL
        if: always()
        run: docker compose down --volumes --remove-orphans
