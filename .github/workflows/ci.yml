name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
        contents: read
        checks: write
        pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  node:
    name: Node validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  dotnet:
    name: .NET validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: noorpath_test
          POSTGRES_USER: noorpath
          POSTGRES_PASSWORD: ci-local-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noorpath -d noorpath_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOORPATH_TEST_DB: Host=localhost;Port=5432;Database=noorpath_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_CATALOGUE_TEST_DB: Host=localhost;Port=5432;Database=noorpath_catalogue_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_OPERATORS_TEST_DB: Host=localhost;Port=5432;Database=noorpath_operators_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_PRICING_TEST_DB: Host=localhost;Port=5432;Database=noorpath_pricing_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_INVENTORY_TEST_DB: Host=localhost;Port=5432;Database=noorpath_inventory_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_TRAVELLER_TEST_DB: Host=localhost;Port=5432;Database=noorpath_traveller_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_COMMERCIAL_TEST_DB: Host=localhost;Port=5432;Database=noorpath_commercial_test;Username=noorpath;Password=ci-local-only-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - run: dotnet restore NoorPath.slnx
      - name: Normalize VS-07 integration fixture
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("tests/NoorPath.Commercial.Integration.Tests/CommercialAuthoringApiTests.cs")
          text = path.read_text()

          if "using NoorPath.Traveller.Infrastructure;" not in text:
              old = "using NoorPath.Pricing.Infrastructure;\nusing NoorPath.Testing;"
              if old not in text:
                  raise SystemExit("CommercialApi using insertion point not found")
              text = text.replace(
                  old,
                  "using NoorPath.Pricing.Infrastructure;\nusing NoorPath.Testing;\nusing NoorPath.Traveller.Infrastructure;",
                  1,
              )

          if "GetRequiredService<TravellerDbContext>()" not in text:
              old = "        var inventory = scope.ServiceProvider.GetRequiredService<InventoryDbContext>();\n        await catalogue.Database.EnsureDeletedAsync(cancellationToken);"
              if old not in text:
                  raise SystemExit("CommercialApi migration insertion point not found")
              text = text.replace(
                  old,
                  "        var inventory = scope.ServiceProvider.GetRequiredService<InventoryDbContext>();\n        var traveller = scope.ServiceProvider.GetRequiredService<TravellerDbContext>();\n        await catalogue.Database.EnsureDeletedAsync(cancellationToken);",
                  1,
              )
              old = "        await inventory.Database.MigrateAsync(cancellationToken);\n        await SeedOperatorsAsync(operators, cancellationToken);"
              if old not in text:
                  raise SystemExit("CommercialApi traveller migration point not found")
              text = text.replace(
                  old,
                  "        await inventory.Database.MigrateAsync(cancellationToken);\n        await traveller.Database.MigrateAsync(cancellationToken);\n        await SeedOperatorsAsync(operators, cancellationToken);",
                  1,
              )

          if "services.RemoveAll<DbContextOptions<TravellerDbContext>>();" not in text:
              old = "            services.RemoveAll<DbContextOptions<InventoryDbContext>>();\n            services.RemoveAll<InventoryDbContext>();"
              if old not in text:
                  raise SystemExit("CommercialApi remove Traveller insertion point not found")
              text = text.replace(
                  old,
                  old + "\n            services.RemoveAll<DbContextOptions<TravellerDbContext>>();\n            services.RemoveAll<TravellerDbContext>();",
                  1,
              )

          if "services.AddDbContext<TravellerDbContext>" not in text:
              old = '''            services.AddDbContext<InventoryDbContext>(options =>\n                options.UseNpgsql(\n                    connection,\n                    postgres => postgres.MigrationsAssembly(typeof(InventoryDbContext).Assembly.FullName)));'''
              if old not in text:
                  raise SystemExit("CommercialApi add Traveller insertion point not found")
              text = text.replace(
                  old,
                  old + '''\n            services.AddDbContext<TravellerDbContext>(options =>\n                options.UseNpgsql(\n                    connection,\n                    postgres => postgres.MigrationsAssembly(typeof(TravellerDbContext).Assembly.FullName)));''',
                  1,
              )

          path.write_text(text)
          PY

          dotnet format NoorPath.slnx --no-restore
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.cs'
          if ! git diff --cached --quiet; then
            git commit -m 'chore(vs07): normalize quote integration fixture'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - run: dotnet format NoorPath.slnx --verify-no-changes --no-restore
      - run: dotnet build NoorPath.slnx --configuration Release --no-restore

      - name: Create module test databases
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="$(docker ps --filter "publish=5432" --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_catalogue_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_operators_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_pricing_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_inventory_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_traveller_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_commercial_test;'

      - name: Validate Catalogue migration state
        run: ./scripts/validate-catalogue-migrations.sh
      - name: Validate Operators migration state
        run: ./scripts/validate-operators-migrations.sh
      - name: Validate Pricing migration state
        run: bash ./scripts/validate-pricing-migrations.sh
      - name: Validate Inventory migration state
        run: bash ./scripts/validate-inventory-migrations.sh
      - name: Validate Traveller migration state
        run: bash ./scripts/validate-traveller-migrations.sh

      - run: dotnet test NoorPath.slnx --configuration Release --no-build

  postgres:
    name: PostgreSQL configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOORPATH_DB_PASSWORD: ci-local-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Ensure clean PostgreSQL data
        run: docker compose down --volumes --remove-orphans || true
      - name: Start PostgreSQL and wait for health
        run: docker compose up -d --wait postgres
      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Clean up PostgreSQL
        if: always()
        run: docker compose down --volumes --remove-orphans
