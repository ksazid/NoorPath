name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    # Only run on push or on PRs from the same repository (skip fork PRs)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
        contents: read
        checks: write
        pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vs02_product_gate_patch:
    name: VS-02 unsaved navigation guard
    if: github.event_name == 'pull_request' && github.head_ref == 'vs02/package-departure-authoring'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply navigation guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/operator/departures/DepartureComposer.tsx')
          text = path.read_text()

          replacements = [
              (
                  'import { useEffect, useMemo, useState, type ReactNode } from "react";',
                  'import {\n  useEffect,\n  useMemo,\n  useState,\n  type MouseEvent,\n  type ReactNode,\n} from "react";',
              ),
              (
                  'function Brand() {\n  return (\n    <Link className="brand" href="/" aria-label="NoorPath home">',
                  'function Brand({\n  onNavigate,\n}: {\n  onNavigate?: (event: MouseEvent<HTMLAnchorElement>) => void;\n}) {\n  return (\n    <Link\n      className="brand"\n      href="/"\n      aria-label="NoorPath home"\n      onClick={onNavigate}\n    >',
              ),
              (
                  '  const markDirty = () => {',
                  '  const guardNavigation = (event: MouseEvent<HTMLAnchorElement>) => {\n    if (state === "saving") {\n      event.preventDefault();\n      return;\n    }\n\n    if (\n      isDirty &&\n      !window.confirm("Discard unsaved changes and leave this draft?")\n    ) {\n      event.preventDefault();\n    }\n  };\n\n  const markDirty = () => {',
              ),
              (
                  '      <aside className="admin-sidebar composer-sidebar">\n        <Brand />',
                  '      <aside className="admin-sidebar composer-sidebar">\n        <Brand onNavigate={guardNavigation} />',
              ),
              (
                  '            href="/operator/departures/new"\n            aria-current="page"\n          >\n            <Icon>◈</Icon>\n            Package drafts',
                  '            href="/operator/departures/new"\n            aria-current={departureId ? undefined : "page"}\n            onClick={guardNavigation}\n          >\n            <Icon>◈</Icon>\n            New package draft',
              ),
              (
                  '            <Link className="secondary-button" href="/operator/departures/new">\n              New draft\n            </Link>',
                  '            <Link\n              className="secondary-button"\n              href="/operator/departures/new"\n              onClick={guardNavigation}\n            >\n              New draft\n            </Link>',
              ),
          ]

          applied = 0
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected source snippet: {old[:80]!r}')
              text = text.replace(old, new, 1)
              applied += 1

          if applied != len(replacements):
              raise SystemExit(f'Expected {len(replacements)} replacements, got {applied}')

          path.write_text(text)
          PY
      - name: Format guarded UI
        run: pnpm --filter @noorpath/web exec prettier --write app/operator/departures/DepartureComposer.tsx
      - name: Commit navigation guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/operator/departures/DepartureComposer.tsx
          git diff --cached --quiet && { echo "Navigation guard produced no diff"; exit 1; }
          git commit -m "fix: guard unsaved VS-02 navigation"
          git push origin HEAD:${{ github.head_ref }}

  node:
    name: Node validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  dotnet:
    name: .NET validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: noorpath_test
          POSTGRES_USER: noorpath
          POSTGRES_PASSWORD: ci-local-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noorpath -d noorpath_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOORPATH_TEST_DB: Host=localhost;Port=5432;Database=noorpath_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_CATALOGUE_TEST_DB: Host=localhost;Port=5432;Database=noorpath_catalogue_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_OPERATORS_TEST_DB: Host=localhost;Port=5432;Database=noorpath_operators_test;Username=noorpath;Password=ci-local-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - run: dotnet restore NoorPath.slnx
      - run: dotnet format NoorPath.slnx --verify-no-changes --no-restore
      - run: dotnet build NoorPath.slnx --configuration Release --no-restore

      - name: Create module test databases
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="$(docker ps --filter "publish=5432" --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_catalogue_test;'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test -c 'CREATE DATABASE noorpath_operators_test;'

      - name: Validate Catalogue migration state
        run: ./scripts/validate-catalogue-migrations.sh
      - name: Validate Operators migration state
        run: ./scripts/validate-operators-migrations.sh

      - run: dotnet test NoorPath.slnx --configuration Release --no-build

  postgres:
    name: PostgreSQL configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOORPATH_DB_PASSWORD: ci-local-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Ensure clean PostgreSQL data
        run: docker compose down --volumes --remove-orphans || true
      - name: Start PostgreSQL and wait for health
        run: docker compose up -d --wait postgres
      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Clean up PostgreSQL
        if: always()
        run: docker compose down --volumes --remove-orphans