name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  secrets:
    name: Secret scanning
    if: >-
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'certify')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  node:
    name: Node validation
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'certify')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Validate slice manifests
        run: pnpm slice:validate
      - name: Verify pre-commit formatting automation
        shell: bash
        run: |
          set -euo pipefail
          CI= pnpm hooks:install

          smoke_file="apps/web/.prettier-hook-smoke.mjs"
          cleanup() {
            git reset -- "$smoke_file" >/dev/null 2>&1 || true
            rm -f "$smoke_file"
          }
          trap cleanup EXIT

          printf 'const value={nested:true}\n' > "$smoke_file"
          git add "$smoke_file"

          hooks_path="$(git config core.hooksPath)"
          "$hooks_path/pre-commit"

          grep -Fx 'const value = { nested: true };' "$smoke_file"
          git diff --cached --name-only -- "$smoke_file" | grep -Fx "$smoke_file"
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  dotnet:
    name: .NET validation
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'certify')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: noorpath_test
          POSTGRES_USER: noorpath
          POSTGRES_PASSWORD: ci-local-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noorpath -d noorpath_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOORPATH_TEST_DB: Host=localhost;Port=5432;Database=noorpath_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_CATALOGUE_TEST_DB: Host=localhost;Port=5432;Database=noorpath_catalogue_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_OPERATORS_TEST_DB: Host=localhost;Port=5432;Database=noorpath_operators_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_PRICING_TEST_DB: Host=localhost;Port=5432;Database=noorpath_pricing_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_INVENTORY_TEST_DB: Host=localhost;Port=5432;Database=noorpath_inventory_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_TRAVELLER_TEST_DB: Host=localhost;Port=5432;Database=noorpath_traveller_test;Username=noorpath;Password=ci-local-only-password
      NOORPATH_COMMERCIAL_TEST_DB: Host=localhost;Port=5432;Database=noorpath_commercial_test;Username=noorpath;Password=ci-local-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10
      - run: dotnet restore NoorPath.slnx
      - run: dotnet format NoorPath.slnx --verify-no-changes --no-restore
      - run: dotnet build NoorPath.slnx --configuration Release --no-restore
      - name: Create module test databases
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="$(docker ps --filter "publish=5432" --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          for database in catalogue operators pricing inventory traveller commercial; do
            docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U noorpath -d noorpath_test \
              -c "CREATE DATABASE noorpath_${database}_test;"
          done
      - name: Validate Catalogue migration state
        run: ./scripts/validate-catalogue-migrations.sh
      - name: Validate Operators migration state
        run: ./scripts/validate-operators-migrations.sh
      - name: Validate Pricing migration state
        run: bash ./scripts/validate-pricing-migrations.sh
      - name: Validate Inventory migration state
        run: bash ./scripts/validate-inventory-migrations.sh
      - name: Validate Traveller migration state
        run: bash ./scripts/validate-traveller-migrations.sh
      - run: dotnet test NoorPath.slnx --configuration Release --no-build

  postgres:
    name: PostgreSQL configuration
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'certify')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOORPATH_DB_PASSWORD: ci-local-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Ensure clean PostgreSQL data
        run: docker compose down --volumes --remove-orphans || true
      - name: Start PostgreSQL and wait for health
        run: docker compose up -d --wait postgres
      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Clean up PostgreSQL
        if: always()
        run: docker compose down --volumes --remove-orphans

  certification-summary:
    name: Certification summary
    if: >-
      always() &&
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'certify'))
    needs: [secrets, node, dotnet, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve slice
        id: slice
        run: node scripts/slice.mjs resolve --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" --optional --github-output
      - name: Require successful certification jobs
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          NODE_RESULT: ${{ needs.node.result }}
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          set -euo pipefail
          for result in "$SECRETS_RESULT" "$NODE_RESULT" "$DOTNET_RESULT" "$POSTGRES_RESULT"; do
            test "$result" = "success"
          done
      - name: Write certification evidence
        run: |
          cat > certification-summary.md <<EOF
          # NoorPath certification

          - Slice: ${{ steps.slice.outputs.slice_id }}
          - Exact SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          - Secret scanning: passed
          - Node validation: passed
          - .NET and migration validation: passed
          - PostgreSQL configuration: passed
          - Rendered review: required separately when enabled
          - Product Owner acceptance: required through \`po-approved\`
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: certification-summary
          path: certification-summary.md
      - name: Update PR certification comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- noorpath-certification -->';
            const body = `${marker}\n## Automated certification\n\n- Slice: \`${{ steps.slice.outputs.slice_id }}\`\n- Exact SHA: \`${context.payload.pull_request.head.sha}\`\n- CI, migrations, PostgreSQL and secret scanning: **passed**\n- Rendered Slice Review: **required when enabled**\n- Product Owner acceptance: **requires \`po-approved\`**\n\nAny later commit invalidates this evidence and reruns certification while the \`certify\` label remains.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
