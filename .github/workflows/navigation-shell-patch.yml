name: Navigation shell patch

on:
  push:
    branches:
      - docs/navigation-verification-gate
    paths:
      - .github/workflows/navigation-shell-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/navigation-verification-gate
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply protected-shell and test changes
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("apps/web/app/operator/cancellations/page.tsx")
          text = page.read_text()
          text = text.replace(
              'import { Icon, PublicFooter, PublicHeader } from "../../public-ui";',
              'import { Icon } from "../../public-ui";\nimport OperatorWorkspaceShell from "../OperatorWorkspaceShell";',
          )
          text = text.replace(
              '''  return (\n    <div className="journey-page">\n      <PublicHeader mode="detail" />\n      <main id="main-content" className="journey-main">\n''',
              '''  return (\n    <OperatorWorkspaceShell\n      title="Cancellation & refund review"\n      summary="Review immutable policy calculations, decide whole-booking requests, and execute only system-authorized refunds."\n    >\n''',
          )
          text = text.replace(
              '''        <p className="public-eyebrow">Governed financial operations</p>\n        <h1>Cancellation &amp; refund review</h1>\n        <p className="journey-intro">\n          Review the immutable policy calculation, approve or reject the whole\n          booking request, and execute only the system-authorized refund.\n        </p>\n''',
              '''        <p className="public-eyebrow">Governed financial operations</p>\n''',
          )
          text = text.replace(
              '''      </main>\n      <PublicFooter />\n    </div>\n  );\n''',
              '''    </OperatorWorkspaceShell>\n  );\n''',
          )
          page.write_text(text)

          test = Path("apps/web/e2e/cancellation-refunds.spec.ts")
          source = test.read_text()
          source = source.replace(
              '''test("Operational Support exposes a working cancellation review link", async ({\n  page,\n}) => {\n''',
              '''test("Operational Support exposes a working cancellation review link", async ({\n  page,\n}) => {\n  await mockOperatorOverview(page);\n''',
          )
          source = source.replace(
              '''test("operator receives recoverable stale-version feedback without editing the amount", async ({\n  page,\n}) => {\n  let detailReads = 0;\n''',
              '''test("operator receives recoverable stale-version feedback without editing the amount", async ({\n  page,\n}) => {\n  await mockOperatorOverview(page);\n  let detailReads = 0;\n''',
          )
          source = source.replace(
              '''test("authorized refund remains safe when provider execution is disabled", async ({\n  page,\n}) => {\n  const authorized = {\n''',
              '''test("authorized refund remains safe when provider execution is disabled", async ({\n  page,\n}) => {\n  await mockOperatorOverview(page);\n  const authorized = {\n''',
          )
          test.write_text(source)
          PY
          pnpm --dir apps/web exec prettier --write \
            app/operator/cancellations/page.tsx \
            e2e/cancellation-refunds.spec.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/operator/cancellations/page.tsx apps/web/e2e/cancellation-refunds.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: protect cancellation workspace navigation"
          git push origin HEAD:docs/navigation-verification-gate
