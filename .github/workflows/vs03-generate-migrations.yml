name: Generate VS-03 migrations

on:
  push:
    branches:
      - vs03/pricing-inventory

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vs03/pricing-inventory
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool install --global dotnet-ef --version 10.0.10
      - run: dotnet restore NoorPath.slnx
      - run: dotnet build NoorPath.slnx --configuration Release --no-restore
      - name: Generate Pricing migration
        run: >-
          dotnet ef migrations add VS03PricingBaseline
          --project src/Modules/NoorPath.Pricing.Infrastructure/NoorPath.Pricing.Infrastructure.csproj
          --startup-project apps/api/NoorPath.Api.csproj
          --context PricingDbContext
          --output-dir Migrations
          --configuration Release
          --no-build
      - name: Generate Inventory migration
        run: >-
          dotnet ef migrations add VS03InventoryBaseline
          --project src/Modules/NoorPath.Inventory.Infrastructure/NoorPath.Inventory.Infrastructure.csproj
          --startup-project apps/api/NoorPath.Api.csproj
          --context InventoryDbContext
          --output-dir Migrations
          --configuration Release
          --no-build
      - name: Commit generated migrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Modules/NoorPath.Pricing.Infrastructure/Migrations src/Modules/NoorPath.Inventory.Infrastructure/Migrations
          git commit -m "Add VS-03 generated migrations"
          git push origin HEAD:vs03/pricing-inventory
