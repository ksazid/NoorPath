name: VS-08 Test Format Apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-test:
    if: github.event.pull_request.number == 44 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format and commit rendered test
        shell: bash
        run: |
          set -euo pipefail
          test_file='apps/web/e2e/plan-journey.spec.ts'
          pnpm --dir apps/web exec prettier --write 'e2e/plan-journey.spec.ts'

          if git diff --quiet -- "$test_file"; then
            echo "Rendered test already uses Prettier formatting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$test_file"
          git commit -m "style(web): format VS-08 rendered test"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
