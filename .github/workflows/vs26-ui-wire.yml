name: VS-26 UI wire

on:
  push:
    branches:
      - slice/vs26-room-assignment-accommodation-operations
    paths:
      - .github/workflows/vs26-ui-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/vs26-room-assignment-accommodation-operations
      - name: Add booking detail accommodation entry
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/app/operator/OperatorBookingDetail.tsx")
          text = path.read_text()
          marker = '''          {detail.state === "confirmed" ? (\n            <Link\n              className="auth-primary"\n              href={`/operator/bookings/${detail.bookingId}/amend`}\n            >\n              Amend booking\n            </Link>\n          ) : null}\n'''
          if marker not in text:
              raise SystemExit("Booking detail action marker not found")
          replacement = '''          {detail.state === "confirmed" ? (\n            <>\n              <Link\n                className="auth-primary"\n                href={`/operator/bookings/${detail.bookingId}/accommodation`}\n              >\n                Accommodation\n              </Link>\n              <Link\n                className="auth-secondary"\n                href={`/operator/bookings/${detail.bookingId}/amend`}\n              >\n                Amend booking\n              </Link>\n            </>\n          ) : null}\n'''
          path.write_text(text.replace(marker, replacement, 1))
      - name: Commit navigation wire
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/operator/OperatorBookingDetail.tsx
          git commit -m "VS-26: link booking detail to accommodation"
          git push origin HEAD:slice/vs26-room-assignment-accommodation-operations
