name: VS-28 wire and migrate

on:
  push:
    branches:
      - slice/vs28-final-departure-handover-readiness

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Wire persistence, API and navigation
        shell: python
        run: |
          from pathlib import Path

          accommodation = Path('src/Modules/NoorPath.Booking.Infrastructure/AccommodationRecords.cs')
          text = accommodation.read_text()
          needle = '        DepartureManifestPersistence.Configure(modelBuilder);\n'
          replacement = needle + '        DepartureHandoverPersistence.Configure(modelBuilder);\n'
          if 'DepartureHandoverPersistence.Configure' not in text:
              text = text.replace(needle, replacement)
              accommodation.write_text(text)

          program = Path('apps/api/Program.cs')
          text = program.read_text()
          needle = 'app.MapDepartureManifest();\n'
          replacement = needle + 'app.MapDepartureHandover();\n'
          if 'app.MapDepartureHandover();' not in text:
              text = text.replace(needle, replacement)
              program.write_text(text)

          manifest = Path('apps/web/app/operator/OperatorDepartureManifest.tsx')
          text = manifest.read_text()
          needle = '''            <section aria-label="Departure summary">\n              <h2>{state.manifest.departure.packageName}</h2>'''
          replacement = '''            <section aria-label="Departure summary">\n              <div className={styles.actions}>\n                <div>\n                  <h2>{state.manifest.departure.packageName}</h2>\n                </div>\n                <Link\n                  className={styles.secondaryButton}\n                  href={`/operator/departures/${departureId}/handover`}\n                >\n                  Final handover\n                </Link>\n              </div>'''
          if 'Final handover' not in text:
              text = text.replace(needle, replacement)
              manifest.write_text(text)
      - name: Restore tools
        run: dotnet tool restore
      - name: Generate VS-28 migration
        run: |
          if ! ls src/Modules/NoorPath.Booking.Infrastructure/Migrations/*VS28DepartureHandover*.cs >/dev/null 2>&1; then
            dotnet ef migrations add VS28DepartureHandover --project src/Modules/NoorPath.Booking.Infrastructure/NoorPath.Booking.Infrastructure.csproj --startup-project apps/api/NoorPath.Api.csproj --context BookingDbContext
          fi
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed web files
        run: pnpm --dir apps/web exec prettier --write app/operator/OperatorDepartureManifest.tsx app/operator/OperatorDepartureHandover.tsx app/operator/OperatorDepartureHandover.module.css app/operator/departures/[departureId]/handover/page.tsx
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/Program.cs apps/web/app/operator/OperatorDepartureManifest.tsx apps/web/app/operator/OperatorDepartureHandover.tsx apps/web/app/operator/OperatorDepartureHandover.module.css apps/web/app/operator/departures/[departureId]/handover/page.tsx src/Modules/NoorPath.Booking.Infrastructure/AccommodationRecords.cs src/Modules/NoorPath.Booking.Infrastructure/Migrations
          if ! git diff --cached --quiet; then
            git commit -m "VS-28: wire handover and generate migration"
            git push
          fi
