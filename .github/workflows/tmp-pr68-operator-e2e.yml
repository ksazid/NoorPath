name: Temporary PR 68 operator E2E

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  operator-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: noorpath_operator_e2e
          POSTGRES_USER: noorpath
          POSTGRES_PASSWORD: ci-local-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noorpath -d noorpath_operator_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      ASPNETCORE_ENVIRONMENT: Test
      Authentication__Mode: Test
      ConnectionStrings__NoorPath: Host=127.0.0.1;Port=5432;Database=noorpath_operator_e2e;Username=noorpath;Password=ci-local-only-password
      Database__MigrateOnStartup: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-role-aware-operator-routing
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium webkit
      - name: Run operator role-routing acceptance
        id: acceptance
        continue-on-error: true
        run: pnpm --dir apps/web exec playwright test e2e/operator-access.spec.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr68-operator-e2e
          retention-days: 14
          if-no-files-found: ignore
          path: |
            apps/web/test-results
            apps/web/playwright-report
      - name: Record failure
        if: steps.acceptance.outcome != 'success'
        run: |
          gh pr comment 68 --repo ksazid/NoorPath --body "❌ Explicit operator role-routing Playwright verification failed on commit \`${GITHUB_SHA}\`. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          exit 1
      - name: Record success and remove temporary workflow
        if: steps.acceptance.outcome == 'success'
        run: |
          gh pr comment 68 --repo ksazid/NoorPath --body "✅ Explicit operator role-routing Playwright verification passed on commit \`${GITHUB_SHA}\` across desktop Chromium and mobile WebKit, including authenticated Platform Administrator guidance to /admin."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr68-operator-e2e.yml
          git commit -m "Remove one-time operator role E2E workflow"
          git push origin HEAD:agent/fix-role-aware-operator-routing
