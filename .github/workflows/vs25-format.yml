name: VS-25 formatter

on:
  push:
    branches:
      - slice/vs25-operator-booking-amendments-traveller-management
    paths:
      - .github/workflows/vs25-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/vs25-operator-booking-amendments-traveller-management
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec prettier --write app/operator/OperatorBookingAmendment.tsx e2e/operator-booking-amendment.spec.ts
      - run: dotnet restore NoorPath.slnx
      - run: dotnet format NoorPath.slnx --no-restore
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/operator/OperatorBookingAmendment.tsx apps/web/e2e/operator-booking-amendment.spec.ts apps/api/BookingAmendmentEndpoints.cs src/Modules/NoorPath.Booking/BookingAmendment.cs src/Modules/NoorPath.Booking.Infrastructure tests/NoorPath.Booking.Tests/BookingAmendmentPolicyTests.cs tests/NoorPath.Commercial.Integration.Tests/OperatorBookingAmendmentApiTests.cs
          git diff --cached --exit-code && { echo "No formatter changes"; exit 1; } || true
          git commit -m "VS-25: apply repository formatting"
          git push origin HEAD:slice/vs25-operator-booking-amendments-traveller-management
