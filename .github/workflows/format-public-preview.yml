name: Format public preview

on:
  push:
    branches:
      - public/package-details-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public/package-details-hardening
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format public preview files
        run: >-
          pnpm --dir apps/web exec prettier --write
          app/page.tsx
          'app/packages/[departureId]/page.tsx'
          app/public-package-preview.ts
          app/public-ui.tsx
      - name: Commit deterministic formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/page.tsx \
            'apps/web/app/packages/[departureId]/page.tsx' \
            apps/web/app/public-package-preview.ts \
            apps/web/app/public-ui.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "chore: format public preview"
          git push origin HEAD:public/package-details-hardening
