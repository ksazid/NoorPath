name: VS-26 wire and migrate

on:
  push:
    branches:
      - slice/vs26-room-assignment-accommodation-operations
    paths:
      - .github/workflows/vs26-wire-and-migrate.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/vs26-room-assignment-accommodation-operations
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Patch implementation hooks
        shell: python
        run: |
          from pathlib import Path

          endpoint = Path("apps/api/AccommodationAssignmentEndpoints.cs")
          text = endpoint.read_text()
          old = "return (null, access.OperatorId, principal.AccountId);"
          new = "return (null, access.OperatorId, principal.AccountId.Value);"
          if old in text:
              endpoint.write_text(text.replace(old, new, 1))

          db = Path("src/Modules/NoorPath.Booking.Infrastructure/BookingDbContext.cs")
          text = db.read_text()
          old = '    protected override void OnModelCreating(ModelBuilder modelBuilder) => Configure(modelBuilder);\n'
          if old in text:
              new = '''    protected override void OnModelCreating(ModelBuilder modelBuilder)\n    {\n        Configure(modelBuilder);\n        AccommodationPersistence.ConfigureAccommodation(modelBuilder);\n    }\n'''
              db.write_text(text.replace(old, new, 1))

          program = Path("apps/api/Program.cs")
          text = program.read_text()
          if "app.MapAccommodationAssignments();" not in text:
              old = 'app.MapBookingAmendments();\n'
              if old not in text:
                  raise SystemExit("Program mapping hook not found")
              program.write_text(text.replace(old, old + 'app.MapAccommodationAssignments();\n', 1))
      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore NoorPath.slnx
          dotnet build apps/api/NoorPath.Api.csproj --no-restore
      - name: Generate migration
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef migrations add VS26AccommodationAssignments \
            --project src/Modules/NoorPath.Booking.Infrastructure/NoorPath.Booking.Infrastructure.csproj \
            --startup-project apps/api/NoorPath.Api.csproj \
            --context BookingDbContext \
            --output-dir Migrations
      - name: Commit implementation wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/AccommodationAssignmentEndpoints.cs apps/api/Program.cs src/Modules/NoorPath.Booking.Infrastructure/BookingDbContext.cs src/Modules/NoorPath.Booking.Infrastructure/Migrations
          git commit -m "VS-26: wire accommodation persistence and migration"
          git push origin HEAD:slice/vs26-room-assignment-accommodation-operations
