name: VS-16 Runtime Correction

on:
  push:
    branches:
      - codex/vs16-cancellation-refunds-runtime

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vs16-cancellation-refunds-runtime
          fetch-depth: 0
      - name: Correct response and test contracts
        run: |
          perl -0pi -e 's/public bool IsSuccess => StatusCode is >= 200 and < 300;/public bool IsSuccess => Value is not null;/' apps/api/CancellationRefundService.cs
          perl -0pi -e 's/Assert\.Equal\("Cancelled", approvedBody\.RootElement\.GetProperty\("customerStatus"\)\.GetString\(\)\);/Assert.Equal("RefundPending", approvedBody.RootElement.GetProperty("customerStatus").GetString());/' tests/NoorPath.Commercial.Integration.Tests/CancellationRefundApiTests.cs
          grep -F 'public bool IsSuccess => Value is not null;' apps/api/CancellationRefundService.cs
          grep -F 'Assert.Equal("RefundPending", approvedBody.RootElement.GetProperty("customerStatus").GetString());' tests/NoorPath.Commercial.Integration.Tests/CancellationRefundApiTests.cs
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore NoorPath.slnx
      - run: dotnet format NoorPath.slnx --no-restore
      - run: dotnet build NoorPath.slnx --configuration Release --no-restore
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/CancellationRefundService.cs tests/NoorPath.Commercial.Integration.Tests/CancellationRefundApiTests.cs
          git commit -m "VS-16: align refund response and customer status contracts"
          git pull --rebase origin codex/vs16-cancellation-refunds-runtime
          git push origin HEAD:codex/vs16-cancellation-refunds-runtime
