name: VS-08 Evidence Cleanup

on:
  push:
    branches: [agent/vs08-inventory-hold]

permissions:
  contents: write

jobs:
  clean-evidence-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs08-inventory-hold
      - name: Capture full-page evidence from the document top
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/web/e2e/plan-journey.spec.ts")
          content = path.read_text()
          targets = [
              """  await page.screenshot({
    path: `test-results/vs08-active-hold-${testInfo.project.name}.png`,""",
              """  await page.screenshot({
    path: `test-results/vs08-released-hold-${testInfo.project.name}.png`,""",
              """  await page.screenshot({
    path: "test-results/vs08-active-hold-mobile-360-text-200.png",""",
          ]
          replacements = [
              """  await page.evaluate(() => window.scrollTo(0, 0));
  await page.screenshot({
    path: `test-results/vs08-active-hold-${testInfo.project.name}.png`,""",
              """  await page.evaluate(() => window.scrollTo(0, 0));
  await page.screenshot({
    path: `test-results/vs08-released-hold-${testInfo.project.name}.png`,""",
              """  await page.evaluate(() => window.scrollTo(0, 0));
  await page.screenshot({
    path: "test-results/vs08-active-hold-mobile-360-text-200.png",""",
          ]

          for target, replacement in zip(targets, replacements):
              if target not in content:
                  raise SystemExit(f"Expected screenshot marker was not found: {target}")
              content = content.replace(target, replacement, 1)

          path.write_text(content)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/e2e/plan-journey.spec.ts
          git rm .github/workflows/vs08-evidence-cleanup.yml
          git commit -m "test(web): normalize VS-08 evidence capture"
          git push origin HEAD:agent/vs08-inventory-hold
