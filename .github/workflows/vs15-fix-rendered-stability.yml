name: VS-15 rendered stability repair

on:
  push:
    branches:
      - codex/vs15-family-booking-mahram-runtime
    paths:
      - .github/workflows/vs15-fix-rendered-stability.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: noorpath_vs15_rendered_repair
          POSTGRES_USER: noorpath
          POSTGRES_PASSWORD: ci-local-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noorpath -d noorpath_vs15_rendered_repair"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      ASPNETCORE_ENVIRONMENT: Test
      Authentication__Mode: Test
      ConnectionStrings__NoorPath: Host=127.0.0.1;Port=5432;Database=noorpath_vs15_rendered_repair;Username=noorpath;Password=ci-local-only-password
      Database__MigrateOnStartup: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vs15-family-booking-mahram-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Stabilize family page and rendered locators
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path("apps/web/app/account/family/page.tsx")
          text = page.read_text()

          replacements = [
              (
                  'import { FormEvent, useCallback, useMemo, useState } from "react";',
                  'import { FormEvent, useCallback, useMemo, useRef, useState } from "react";',
              ),
              (
                  '  const [selectedPartyId, setSelectedPartyId] = useState<string | null>(null);',
                  '  const [selectedPartyId, setSelectedPartyId] = useState<string | null>(null);\n  const selectedPartyIdRef = useRef<string | null>(null);',
              ),
              (
                  '          selectedPartyId ??\n          partiesBody.parties[0]?.id ??',
                  '          selectedPartyIdRef.current ??\n          partiesBody.parties[0]?.id ??',
              ),
              (
                  '        setSelectedPartyId(partyId);\n        setState({',
                  '        selectedPartyIdRef.current = partyId;\n        setSelectedPartyId(partyId);\n        setState({',
              ),
              (
                  '    [selectedPartyId],\n  );\n\n  useDeferredInitialLoad(() => load());',
                  '    [],\n  );\n\n  useDeferredInitialLoad(load);',
              ),
              (
                  '      await load(selectedPartyId ?? undefined);',
                  '      await load(selectedPartyIdRef.current ?? undefined);',
              ),
              (
                  '      setSelectedPartyId(created.id);',
                  '      selectedPartyIdRef.current = created.id;\n      setSelectedPartyId(created.id);',
              ),
              (
                  '                        setSelectedPartyId(event.target.value);\n                        void load(event.target.value);',
                  '                        selectedPartyIdRef.current = event.target.value;\n                        setSelectedPartyId(event.target.value);\n                        void load(event.target.value);',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected page pattern not found: {old[:80]}")
              text = text.replace(old, new, 1)

          first_list = '<ul className={styles.list}>'
          if text.count(first_list) < 2:
              raise SystemExit("Expected both family lists")
          text = text.replace(
              first_list,
              '<ul className={styles.list} aria-label="Travellers in this party">',
              1,
          )
          text = text.replace(
              first_list,
              '<ul className={styles.list} aria-label="Mahram relationships">',
              1,
          )
          page.write_text(text)

          test = Path("apps/web/e2e/family-booking-mahram.spec.ts")
          spec = test.read_text()
          old_assertions = '''  await expect(page.getByText("Amina Khan", { exact: true })).toBeVisible();
          await expect(page.getByText("Omar Khan", { exact: true })).toBeVisible();
          await expect(page.getByText(/Amina Khan → Omar Khan/)).toBeVisible();'''
          new_assertions = '''  const travellers = page.getByRole("list", {
            name: "Travellers in this party",
          });
          await expect(travellers.getByText("Amina Khan", { exact: true })).toBeVisible();
          await expect(travellers.getByText("Omar Khan", { exact: true })).toBeVisible();
          const relationships = page.getByRole("list", {
            name: "Mahram relationships",
          });
          await expect(relationships.getByText(/Amina Khan → Omar Khan/)).toBeVisible();'''
          if old_assertions not in spec:
              raise SystemExit("Expected traveller assertions not found")
          spec = spec.replace(old_assertions, new_assertions, 1)
          old_click = '''  await page.goto("/account/family");
          await page.getByRole("button", { name: "Validate party" }).click();'''
          new_click = '''  await page.goto("/account/family");
          await expect(page.getByRole("heading", { name: "Khan family" })).toBeVisible();
          const validate = page.getByRole("button", { name: "Validate party" });
          await expect(validate).toBeVisible();
          await validate.click();'''
          if old_click not in spec:
              raise SystemExit("Expected validate click not found")
          spec = spec.replace(old_click, new_click, 1)
          test.write_text(spec)
          PY
      - name: Format repaired files
        run: >-
          pnpm --dir apps/web exec prettier --write
          "app/account/family/page.tsx"
          "e2e/family-booking-mahram.spec.ts"
      - name: Install browsers
        run: pnpm --dir apps/web exec playwright install --with-deps chromium webkit
      - name: Verify VS-15 desktop and mobile acceptance
        run: pnpm --dir apps/web exec playwright test e2e/family-booking-mahram.spec.ts
      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/account/family/page.tsx apps/web/e2e/family-booking-mahram.spec.ts
          git commit -m "Stabilize VS-15 family rendered flow"
          git push origin HEAD:codex/vs15-family-booking-mahram-runtime
