name: VS-26 build diagnostics

on:
  push:
    branches:
      - slice/vs26-room-assignment-accommodation-operations
    paths:
      - .github/workflows/vs26-build-diagnostics.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/vs26-room-assignment-accommodation-operations
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore NoorPath.slnx
      - run: dotnet build apps/api/NoorPath.Api.csproj --no-restore
