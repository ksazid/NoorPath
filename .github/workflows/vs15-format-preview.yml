name: VS-15 Format Preview

on:
  push:
    branches:
      - codex/vs15-family-booking-mahram-runtime

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format VS-15 web files
        run: |
          pnpm --dir apps/web exec prettier --write \
            app/account/family/page.tsx \
            'app/bookings/[bookingId]/journey/page.tsx' \
            app/FamilyQuoteBridge.tsx \
            e2e/family-booking-mahram.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: vs15-formatted-web
          path: |
            apps/web/app/account/family/page.tsx
            apps/web/app/bookings/[bookingId]/journey/page.tsx
            apps/web/app/FamilyQuoteBridge.tsx
            apps/web/e2e/family-booking-mahram.spec.ts
          if-no-files-found: error
          retention-days: 1
