name: VS-37 Package Details One-shot

on:
  push:
    branches:
      - agent/vs37-package-details-booking-auth-design

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs37-package-details-booking-auth-design
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply VS-37 patch
        run: python .github/scripts/vs37_patch_once.py
      - name: Remove superseded booking href helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("apps/web/app/packages/[departureId]/page.tsx")
          text = path.read_text()
          text, count = re.subn(
              r'\nfunction bookingHref\(.*?\n}\n\nfunction occupancyLabel',
              '\nfunction occupancyLabel',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"Expected one bookingHref helper, found {count}")
          path.write_text(text)
          PY
      - name: Format changed files
        run: |
          pnpm --dir apps/web exec prettier --write \
            'app/packages/[departureId]/page.tsx' \
            'app/packages/[departureId]/package-conversion.css' \
            'e2e/package-details.spec.ts' \
            '../../delivery/slices/VS-37.json' \
            '../../docs/slices/VS-37-PACKAGE-DETAILS-BOOKING-AUTH-DESIGN.md' \
            '../../docs/slices/VS-37-IMPLEMENTATION-CHECKLIST.md' \
            '../../docs/slices/VS-37-NAVIGATION-VERIFICATION.md'
      - name: Commit VS-37 implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/packages/'[departureId]'/page.tsx \
            apps/web/app/packages/'[departureId]'/package-conversion.css \
            apps/web/e2e/package-details.spec.ts \
            delivery/slices/VS-37.json \
            docs/slices/VS-37-PACKAGE-DETAILS-BOOKING-AUTH-DESIGN.md \
            docs/slices/VS-37-IMPLEMENTATION-CHECKLIST.md \
            docs/slices/VS-37-NAVIGATION-VERIFICATION.md
          git commit -m 'VS-37 rework package details booking decision flow'
          git push origin HEAD:agent/vs37-package-details-booking-auth-design
