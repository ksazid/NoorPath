name: Navigation formatter

on:
  push:
    branches:
      - docs/navigation-verification-gate
    paths:
      - .github/workflows/navigation-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/navigation-verification-gate
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm --dir apps/web exec prettier --write
          app/operator/support/page.tsx
          e2e/cancellation-refunds.spec.ts
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/operator/support/page.tsx apps/web/e2e/cancellation-refunds.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format navigation verification changes"
          git push origin HEAD:docs/navigation-verification-gate
