name: Temporary PR 68 formatter

on:
  push:
    branches:
      - agent/fix-role-aware-operator-routing

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-role-aware-operator-routing
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec prettier --write app/api/v1/operator/access/route.test.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/api/v1/operator/access/route.test.ts
          git commit -m "Format operator access route tests"
          git push origin HEAD:agent/fix-role-aware-operator-routing
