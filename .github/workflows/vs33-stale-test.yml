name: VS-33 stale coverage

on:
  push:
    branches:
      - ux/vs33-departure-fulfilment-group-leader

permissions:
  contents: write

jobs:
  add-stale-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/vs33-departure-fulfilment-group-leader
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore NoorPath.slnx
      - name: Add stale-version integration coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/NoorPath.Commercial.Integration.Tests/OperatorDepartureHandoverApiTests.cs')
          text = path.read_text()
          anchor = '    private static async Task EnsureReadinessSchemasAsync('
          test = '''    [Fact]\n    public async Task Stale_group_leader_write_is_rejected_without_mutation_or_audit()\n    {\n        await using var app = await OperatorBookingAmendmentApi.CreateAsync(\n            TestContext.Current.CancellationToken);\n        await EnsureReadinessSchemasAsync(app, TestContext.Current.CancellationToken);\n        using var client = app.CreateClientFor(OperatorBookingAmendmentApi.OperatorAccount);\n\n        Guid departureId;\n        await using (var scope = app.Services.CreateAsyncScope())\n        {\n            var bookings = scope.ServiceProvider.GetRequiredService<BookingDbContext>();\n            var booking = await bookings.Bookings.AsNoTracking()\n                .SingleAsync(item => item.Id == OperatorBookingAmendmentApi.OwnedBookingId, TestContext.Current.CancellationToken);\n            departureId = booking.DepartureId;\n        }\n\n        var first = await client.PostAsJsonAsync(\n            $\"/api/v1/operator/departures/{departureId}/manifest/group-leader\",\n            new { name = \"Amina Rahman\", expectedVersion = 0 },\n            TestContext.Current.CancellationToken);\n        Assert.Equal(HttpStatusCode.OK, first.StatusCode);\n\n        var stale = await client.PostAsJsonAsync(\n            $\"/api/v1/operator/departures/{departureId}/manifest/group-leader\",\n            new { name = \"Stale Leader\", expectedVersion = 0 },\n            TestContext.Current.CancellationToken);\n        Assert.Equal(HttpStatusCode.Conflict, stale.StatusCode);\n        Assert.Contains(\n            \"departure_operations_stale\",\n            await stale.Content.ReadAsStringAsync(TestContext.Current.CancellationToken),\n            StringComparison.Ordinal);\n\n        await using var verifyScope = app.Services.CreateAsyncScope();\n        var database = verifyScope.ServiceProvider.GetRequiredService<BookingDbContext>();\n        var record = await database.Set<DepartureHandoverRecord>().AsNoTracking()\n            .SingleAsync(TestContext.Current.CancellationToken);\n        Assert.Equal(\"Amina Rahman\", record.GroupLeaderName);\n        Assert.Equal(1, record.Version);\n        Assert.Single(await database.Set<DepartureHandoverAuditRecord>().AsNoTracking()\n            .ToArrayAsync(TestContext.Current.CancellationToken));\n    }\n\n'''
          if 'Stale_group_leader_write_is_rejected_without_mutation_or_audit' not in text:
              if anchor not in text:
                  raise SystemExit('missing test insertion anchor')
              path.write_text(text.replace(anchor, test + anchor, 1))
          PY
          dotnet format NoorPath.slnx --no-restore
      - name: Commit test
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/NoorPath.Commercial.Integration.Tests/OperatorDepartureHandoverApiTests.cs
          git commit -m "VS-33: cover stale group leader writes"
          git push origin HEAD:ux/vs33-departure-fulfilment-group-leader
