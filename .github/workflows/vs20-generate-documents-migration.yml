name: VS-20 Generate Documents Migration

on:
  push:
    branches:
      - hotfix/vs20-documents-migration-discovery
    paths:
      - .github/workflows/vs20-generate-documents-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DOTNET_ENVIRONMENT: Development
      Authentication__Mode: Test
      ConnectionStrings__NoorPath: Host=localhost;Port=5432;Database=noorpath_generation;Username=noorpath;Password=local-generation-only
      InventoryHold__Lifetime: 00:15:00
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/vs20-documents-migration-discovery
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10
      - name: Restore solution
        run: dotnet restore NoorPath.slnx
      - name: Replace hand-written migration with generated metadata
        shell: bash
        run: |
          set -euo pipefail
          migrations="src/Modules/NoorPath.Documents.Infrastructure/Migrations"
          rm -f "$migrations"/*.cs
          dotnet ef migrations add VS20DocumentsMigrationRepair \
            --project src/Modules/NoorPath.Documents.Infrastructure/NoorPath.Documents.Infrastructure.csproj \
            --startup-project apps/api/NoorPath.Api.csproj \
            --context DocumentsDbContext \
            --output-dir Migrations
      - name: Commit generated migration and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/vs20-generate-documents-migration.yml
          git add src/Modules/NoorPath.Documents.Infrastructure/Migrations
          git config user.name "NoorPath migration generator"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "VS-20: generate discoverable Documents migration"
          git push origin HEAD:hotfix/vs20-documents-migration-discovery
