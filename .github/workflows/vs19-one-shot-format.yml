name: VS-19 One-Shot Format

on:
  push:
    branches:
      - slice/vs19-customer-shell-navigation
    paths:
      - .github/workflows/vs19-one-shot-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/vs19-customer-shell-navigation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format exact VS-19 files
        run: |
          pnpm --dir apps/web exec prettier --write \
            app/CustomerRouteShell.tsx \
            app/support/page.tsx \
            app/terms/page.tsx \
            e2e/customer-shell-navigation.spec.ts
          rm .github/workflows/vs19-one-shot-format.yml
      - name: Commit formatted files and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/CustomerRouteShell.tsx \
            apps/web/app/support/page.tsx \
            apps/web/app/terms/page.tsx \
            apps/web/e2e/customer-shell-navigation.spec.ts \
            .github/workflows/vs19-one-shot-format.yml
          git commit -m "chore: format VS-19 frontend files"
          git push origin HEAD:slice/vs19-customer-shell-navigation
