name: VS35 One-Shot Format

on:
  push:
    branches:
      - agent/vs35-package-details-conversion-ux

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'VS-35 format frontend files') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs35-package-details-conversion-ux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format VS-35 frontend files
        run: |
          pnpm --dir apps/web exec prettier --write \
            'app/packages/[departureId]/page.tsx' \
            'app/packages/[departureId]/package-conversion.css' \
            'app/packages/[departureId]/package-conversion-accessibility.css' \
            'app/packages/[departureId]/layout.tsx' \
            'e2e/package-details.spec.ts'
          rm .github/workflows/vs35-format.yml
      - name: Commit formatted files and remove formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web .github/workflows/vs35-format.yml
          git commit -m "VS-35 format frontend files"
          git push origin HEAD:agent/vs35-package-details-conversion-ux
