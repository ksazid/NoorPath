              "- Keep Milestone and Pay Later presentations with total, pay-today and remaining commitment before Book now.",
              "- Show Pay Full, Milestone and Pay Later with total, pay-today and remaining commitment before Book now; selected mode must carry into authoritative quote creation."
          )
          replace_once(
              "docs/slices/VS-36-PACKAGE-DETAILS-DESIGN-CORRECTION.md",
              "- [ ] Milestone/Pay Later values and booking href remain unchanged from VS-35 semantics.",
              "- [ ] Pay Full, Milestone and Pay Later each show the correct commitment and the selected mode reaches quote creation."
          )
          replace_once(
              "docs/slices/VS-36-PACKAGE-DETAILS-DESIGN-CORRECTION.md",
              "- API, database, Pricing, Inventory, Booking or payment-domain changes.",
              "- Database migrations, Inventory model changes, Booking schema changes or payment-provider changes."
          )
          replace_once(
              "docs/slices/VS-36-IMPLEMENTATION-CHECKLIST.md",
              "- [x] Milestone and Pay Later financial breakdowns remain authoritative and unchanged semantically.",
              "- [x] Pay Full, Milestone and Pay Later are visible before booking and each maps to an authoritative quote commitment."
          )

          import json
          manifest_path = Path("delivery/slices/VS-36.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["outcome"] = "Prospective customers receive the corrected NoorPath Package presentation with explicit adult, child and infant guest categories plus three truthful payment choices: Pay Full, Milestone and Pay Later."
          manifest["modules"] = [
              "Pricing quote calculation interprets the selected payment mode without a database migration.",
              "The web application preserves server-authoritative travel-date, occupancy and base payment-plan data.",
              "Operator package configuration remains the source of package inclusion and exclusion values.",
              "Approved NoorPath Package references and design-system/MASTER.md remain visual authority."
          ]
          manifest["routes"] = [
              item.replace("Milestone or Pay Later", "Pay Full, Milestone or Pay Later")
                  .replace("existing authoritative payment presentation", "authoritative payment commitment")
              for item in manifest["routes"]
          ]
          manifest["acceptance"] = [
              item.replace("Milestone and Pay Later values, Book now query handoff and existing failure states remain unchanged semantically.",
                           "Pay Full, Milestone and Pay Later show correct pay-today/remaining values, carry through Book now, and create the matching authoritative quote schedule.")
              for item in manifest["acceptance"]
          ]
          manifest["exclusions"] = [
              item.replace("API, database, Pricing, Inventory, Booking or payment-domain changes.",
                           "Database migrations, Inventory model changes, Booking schema changes or payment-provider changes.")
              for item in manifest["exclusions"]
          ]
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
