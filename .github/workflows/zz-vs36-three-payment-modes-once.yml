name: VS-36 Three Payment Modes One-shot

on:
  push:
    branches:
      - agent/vs36-package-details-design-correction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs36-package-details-design-correction
      - name: Apply three payment modes
