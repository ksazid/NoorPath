name: VS-26 format E2E

on:
  push:
    branches:
      - slice/vs26-room-assignment-accommodation-operations
    paths:
      - .github/workflows/vs26-format-e2e.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/vs26-room-assignment-accommodation-operations
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format VS-26 E2E
        run: pnpm --dir apps/web exec prettier --write e2e/operator-accommodation.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/operator-accommodation.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "VS-26: format accommodation E2E"
          git push origin HEAD:slice/vs26-room-assignment-accommodation-operations
