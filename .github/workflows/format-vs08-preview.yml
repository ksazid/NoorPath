name: Format VS-08 Preview

on:
  push:
    branches:
      - ui/vs08-preview

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: ui/vs08-preview

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format preview files
        run: |
          pnpm --dir apps/web exec prettier --write \
            app/api/v1/departures/preview-fixture.ts \
            app/api/v1/departures/preview-quote.ts \
            app/api/v1/preview-hold.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/api/v1/departures/preview-fixture.ts \
            apps/web/app/api/v1/departures/preview-quote.ts \
            apps/web/app/api/v1/preview-hold.ts
          git commit -m "style(preview): apply Prettier formatting"
          git push origin HEAD:ui/vs08-preview
