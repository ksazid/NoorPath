name: VS-07 Format Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-once:
    if: github.event.pull_request.number == 41 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec prettier --write e2e/plan-journey.spec.ts

      - name: Commit normalized spec
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/e2e/plan-journey.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(vs07): format rendered acceptance spec'
            git push origin HEAD:${{ github.head_ref }}
          fi
