name: Slice Governance

on:
  pull_request:
    branches: [main]
    types:
      [
        opened,
        edited,
        reopened,
        synchronize,
        ready_for_review,
        labeled,
        unlabeled,
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  governance:
    name: Slice governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure certification labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const desired = [
              {
                name: 'certify',
                color: '1f6feb',
                description: 'Run full exact-head slice certification',
              },
              {
                name: 'po-approved',
                color: '0e8a16',
                description: 'Product Owner accepted the exact certified SHA',
              },
            ];
            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const label of desired) {
              if (!labels.some((existing) => existing.name === label.name)) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              }
            }
      - name: Validate manifests and required planning files
        run: node scripts/slice.mjs validate
      - name: Validate navigation matrix registrations
        run: node scripts/navigation-verification.mjs validate
      - name: Resolve current slice
        id: slice
        run: node scripts/slice.mjs resolve --branch "$GITHUB_HEAD_REF" --optional --github-output
      - name: Enforce navigation evidence before certification
        if: contains(github.event.pull_request.labels.*.name, 'certify')
        run: >-
          node scripts/navigation-verification.mjs verify
          --branch "$GITHUB_HEAD_REF"
          --optional
      - name: Enforce Draft and certification discipline
        uses: actions/github-script@v7
        env:
          SLICE_ID: ${{ steps.slice.outputs.slice_id }}
          SPEC_PATH: ${{ steps.slice.outputs.spec_path }}
          CHECKLIST_PATH: ${{ steps.slice.outputs.checklist_path }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map((label) => label.name);
            const isSlice = process.env.SLICE_ID !== 'NONE';

            if (!labels.includes('certify') && !pr.draft && isSlice) {
              core.setFailed(
                'Product slice PRs must remain Draft until the certify label is applied.',
              );
            }
            if (labels.includes('po-approved') && !labels.includes('certify')) {
              core.setFailed(
                'po-approved requires the certify label and exact-head certification.',
              );
            }
            if (!isSlice) return;

            const body = pr.body ?? '';
            const required = [
              '## Outcome',
              '## Explicit exclusions',
              '## Merge rule',
              process.env.SPEC_PATH,
              process.env.CHECKLIST_PATH,
            ];
            const missing = required.filter((value) => !body.includes(value));
            if (missing.length > 0) {
              core.setFailed(`PR body is missing: ${missing.join(', ')}`);
            }
