name: VS-38 Temporary A11y Fix

on:
  push:
    branches:
      - agent/vs38-travel-fact-authoring

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs38-travel-fact-authoring
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Fix field label semantics
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/app/operator/departures/TravelFactsEditor.tsx")
          text = path.read_text()
          text = text.replace(
              'import { type ReactNode, useEffect, useState } from "react";',
              'import { cloneElement, type ReactElement, useEffect, useState } from "react";',
          )
          old = '''function Field({
            id,
            label,
            error,
            hint,
            children,
          }: {
            id: string;
            label: string;
            error?: string;
            hint?: string;
            children: ReactNode;
          }) {
            return (
              <label
                className={`${styles.field} ${error ? styles.fieldError : ""}`}
                htmlFor={id}
              >
                <span>{label}</span>
                {children}
                {error ? (
                  <small className={styles.errorText}>{error}</small>
                ) : (
                  hint && <small>{hint}</small>
                )}
              </label>
            );
          }'''
          new = '''function Field({
            id,
            label,
            error,
            hint,
            children,
          }: {
            id: string;
            label: string;
            error?: string;
            hint?: string;
            children: ReactElement<{ "aria-describedby"?: string }>;
          }) {
            const descriptionId = error || hint ? `${id}-description` : undefined;
            const control = descriptionId
              ? cloneElement(children, { "aria-describedby": descriptionId })
              : children;

            return (
              <div className={`${styles.field} ${error ? styles.fieldError : ""}`}>
                <label htmlFor={id}>{label}</label>
                {control}
                {error ? (
                  <small id={descriptionId} className={styles.errorText}>
                    {error}
                  </small>
                ) : (
                  hint && <small id={descriptionId}>{hint}</small>
                )}
              </div>
            );
          }'''
          if old not in text:
              raise SystemExit("Expected Field block was not found")
          path.write_text(text.replace(old, new))
      - run: pnpm exec prettier --write apps/web/app/operator/departures/TravelFactsEditor.tsx
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/operator/departures/TravelFactsEditor.tsx
          git commit -m "VS-38: separate field labels from descriptions"
          git push origin HEAD:agent/vs38-travel-fact-authoring
