name: VS-27 fix certification

on:
  push:
    branches:
      - slice/vs27-departure-manifest-pilgrim-operations
    paths:
      - .github/workflows/vs27-fix-certification.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/vs27-departure-manifest-pilgrim-operations
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Fix back-link target and format VS-27 web files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/operator/OperatorDepartureManifest.module.css')
          text = path.read_text()
          old = ".backLink {\n  width: fit-content;\n  font-weight: 700;\n}"
          new = ".backLink {\n  display: inline-flex;\n  min-height: 44px;\n  width: fit-content;\n  align-items: center;\n  padding: 0.5rem 0.25rem;\n  font-weight: 700;\n}"
          if old not in text:
              raise SystemExit('Expected backLink block not found')
          path.write_text(text.replace(old, new))
          PY
          pnpm --dir apps/web exec prettier --write \
            app/operator/OperatorCollectionPage.tsx \
            app/operator/OperatorDepartureManifest.tsx \
            app/operator/OperatorDepartureManifest.module.css \
            e2e/operator-departure-manifest.spec.ts
          rm .github/workflows/vs27-fix-certification.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/operator/OperatorCollectionPage.tsx \
            apps/web/app/operator/OperatorDepartureManifest.tsx \
            apps/web/app/operator/OperatorDepartureManifest.module.css \
            apps/web/e2e/operator-departure-manifest.spec.ts \
            .github/workflows/vs27-fix-certification.yml
          git commit -m "VS-27: fix formatting and navigation target size"
          git push origin HEAD:slice/vs27-departure-manifest-pilgrim-operations
