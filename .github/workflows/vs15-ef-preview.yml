name: VS-15 EF Migration Preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10
      - name: Restore solution
        run: dotnet restore NoorPath.slnx
      - name: Regenerate Family Booking migration
        shell: bash
        run: |
          set -euo pipefail
          migrations="src/Modules/NoorPath.FamilyBooking.Infrastructure/Migrations"
          rm -f "$migrations"/*.cs
          dotnet ef migrations add VS15FamilyBooking \
            --project src/Modules/NoorPath.FamilyBooking.Infrastructure/NoorPath.FamilyBooking.Infrastructure.csproj \
            --startup-project apps/api/NoorPath.Api.csproj \
            --context FamilyBookingDbContext \
            --output-dir Migrations
          find "$migrations" -maxdepth 1 -type f -print -exec sed -n '1,12p' {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: vs15-generated-migrations
          path: src/Modules/NoorPath.FamilyBooking.Infrastructure/Migrations/*.cs
          if-no-files-found: error
          retention-days: 1
