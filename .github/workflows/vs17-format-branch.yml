name: VS-17 branch formatting

on:
  push:
    branches: [agent/vs17-runtime-implementation]

permissions:
  contents: write

concurrency:
  group: vs17-format-branch
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs17-runtime-implementation
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatter output
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/release-readiness.mjs scripts/release-readiness.test.mjs
          git commit -m "Format VS-17 runtime files"
          git push origin HEAD:agent/vs17-runtime-implementation
