name: VS-37 Test Expectation One-shot

on:
  push:
    branches:
      - agent/vs37-package-details-booking-auth-design

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs37-package-details-booking-auth-design
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Correct Pay Full default expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/package-details.spec.ts')
          text = path.read_text()
          old = '''  await expect(page.getByText("₹2,20,000").first()).toBeVisible();\n  await expect(page.getByText("₹44,000").first()).toBeVisible();\n  await expect(page.getByText("₹1,76,000").first()).toBeVisible();\n'''
          new = '''  await expect(page.getByText("₹2,20,000").first()).toBeVisible();\n  await expect(page.getByText("₹0").first()).toBeVisible();\n'''
          if old not in text:
              raise SystemExit('Initial payment expectation block not found')
          text = text.replace(old, new, 1)
          old_mobile = '  await expect(page.getByText("₹44,000").first()).toBeVisible();\n'
          new_mobile = '  await expect(page.getByText("₹2,20,000").first()).toBeVisible();\n'
          if old_mobile not in text:
              raise SystemExit('Mobile payment expectation not found')
          text = text.replace(old_mobile, new_mobile, 1)
          path.write_text(text)
          PY
      - run: pnpm --dir apps/web exec prettier --write 'e2e/package-details.spec.ts'
      - name: Commit test correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/e2e/package-details.spec.ts
          git commit -m 'VS-37 align tests with Pay Full default'
          git push origin HEAD:agent/vs37-package-details-booking-auth-design
