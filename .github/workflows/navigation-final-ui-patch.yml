name: Navigation final UI patch

on:
  push:
    branches:
      - docs/navigation-verification-gate
    paths:
      - .github/workflows/navigation-final-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/navigation-verification-gate
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply verified navigation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("apps/web/app/bookings/[bookingId]/journey/page.tsx")
          text = page.read_text()
          text = text.replace(
              '<Link href="#cancellation">Review cancellation options</Link>',
              '<Link className="journey-section-link" href="#cancellation">\n            Review cancellation options\n          </Link>',
          )
          page.write_text(text)

          journey_css = Path("apps/web/app/my-journey.css")
          css = journey_css.read_text()
          anchor = '''.journey-hero p:not(.public-eyebrow) {\n  max-width: 650px;\n  color: #dce9e3;\n  line-height: 1.65;\n}\n'''
          addition = anchor + '''.journey-section-link {\n  display: inline-flex;\n  min-height: 44px;\n  align-items: center;\n  margin-top: 10px;\n  padding: 0 14px;\n  border: 1px solid rgba(255, 255, 255, 0.55);\n  border-radius: 12px;\n  color: white;\n  font-weight: 800;\n  text-decoration: none;\n}\n'''
          if '.journey-section-link {' not in css:
              css = css.replace(anchor, addition)
          journey_css.write_text(css)

          public_css = Path("apps/web/app/public.css")
          css = public_css.read_text()
          css = css.replace(
              '''  .package-breadcrumbs {\n    display: none;\n  }\n''',
              '''  .package-breadcrumbs {\n    display: flex;\n    width: calc(100% - 32px);\n    margin: 0 auto;\n    padding-top: 8px;\n  }\n''',
          )
          public_css.write_text(css)

          test = Path("apps/web/e2e/cancellation-refunds.spec.ts")
          source = test.read_text()
          source = source.replace(
              '''  const sidebarLink = page\n    .getByRole("navigation", { name: "Operator navigation" })\n    .getByRole("link", { name: "Cancellations" });\n''',
              '''  const sidebarLink = page\n    .getByRole("complementary", { name: "Operator navigation" })\n    .getByRole("link", { name: "Cancellations" });\n''',
          )
          source = source.replace(
              '''  await expect(page).toHaveURL(/\\/operator$/);\n});\n\ntest("Operational Support exposes a working cancellation review link",''',
              '''  await expect(page).toHaveURL(/\\/operator$/);\n\n  await sidebarLink.click();\n  await expect(page).toHaveURL(/\\/operator\\/cancellations$/);\n  await expect(\n    page.getByRole("heading", { name: "Cancellation & refund review" }),\n  ).toBeVisible();\n});\n\ntest("Operational Support exposes a working cancellation review link",''',
          )
          test.write_text(source)
          PY
          pnpm --dir apps/web exec prettier --write \
            'app/bookings/[bookingId]/journey/page.tsx' \
            app/my-journey.css \
            app/public.css \
            e2e/cancellation-refunds.spec.ts
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'apps/web/app/bookings/[bookingId]/journey/page.tsx' \
            apps/web/app/my-journey.css \
            apps/web/app/public.css \
            apps/web/e2e/cancellation-refunds.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore and verify responsive navigation"
          git push origin HEAD:docs/navigation-verification-gate
