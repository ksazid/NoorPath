name: VS-33 implementation

on:
  push:
    branches:
      - ux/vs33-departure-fulfilment-group-leader

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/vs33-departure-fulfilment-group-leader
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: dotnet tool install --global dotnet-ef --version 10.0.10
      - run: dotnet restore NoorPath.slnx
      - run: python scripts/vs33-impl.py
      - name: Add Booking migration
        run: |
          dotnet ef migrations add VS33DepartureGroupLeader \
            --project src/Modules/NoorPath.Booking.Infrastructure/NoorPath.Booking.Infrastructure.csproj \
            --startup-project apps/api/NoorPath.Api.csproj \
            --context BookingDbContext
      - name: Format and build
        run: |
          dotnet format NoorPath.slnx --no-restore
          pnpm --dir apps/web exec prettier --write \
            app/operator/OperatorDepartureManifest.tsx \
            app/operator/OperatorDepartureManifest.module.css \
            app/operator/OperatorDepartureHandover.tsx \
            e2e/departure-fulfilment-group-leader.spec.ts
          dotnet build NoorPath.slnx --configuration Release --no-restore
          pnpm --dir apps/web exec tsc --noEmit
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/DepartureManifestEndpoints.cs apps/api/DepartureHandoverEndpoints.cs \
            apps/web/app/operator/OperatorDepartureManifest.tsx \
            apps/web/app/operator/OperatorDepartureManifest.module.css \
            apps/web/app/operator/OperatorDepartureHandover.tsx \
            apps/web/e2e/departure-fulfilment-group-leader.spec.ts \
            src/Modules/NoorPath.Booking.Infrastructure/DepartureHandoverRecords.cs \
            src/Modules/NoorPath.Booking.Infrastructure/Migrations \
            tests/NoorPath.Commercial.Integration.Tests/OperatorDepartureHandoverApiTests.cs
          git commit -m "VS-33: implement departure fulfilment and group leader"
          git push origin HEAD:ux/vs33-departure-fulfilment-group-leader
