name: VS-08 Format Capture

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-capture:
    if: github.event.pull_request.number == 44 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format and commit plan page
        shell: bash
        run: |
          set -euo pipefail
          plan_file='apps/web/app/packages/[departureId]/plan/page.tsx'
          pnpm --dir apps/web exec prettier --write 'app/packages/[departureId]/plan/page.tsx'

          if git diff --quiet -- "$plan_file"; then
            echo "Plan page already uses Prettier formatting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$plan_file"
          git commit -m "style(web): format VS-08 plan journey"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
