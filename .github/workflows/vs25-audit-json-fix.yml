name: VS-25 audit JSON fix

on:
  push:
    branches:
      - slice/vs25-operator-booking-amendments-traveller-management
    paths:
      - .github/workflows/vs25-audit-json-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/vs25-operator-booking-amendments-traveller-management
      - name: Patch endpoint JSON enum serialization
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/api/BookingAmendmentEndpoints.cs")
          text = path.read_text()
          text = text.replace(
              "using System.Text.Json;\n",
              "using System.Text.Json;\nusing System.Text.Json.Serialization;\n",
              1,
          )
          old = '    private static readonly JsonSerializerOptions JsonOptions = new(JsonSerializerDefaults.Web);\n'
          new = '''    private static readonly JsonSerializerOptions JsonOptions = CreateJsonOptions();\n\n    private static JsonSerializerOptions CreateJsonOptions()\n    {\n        var options = new JsonSerializerOptions(JsonSerializerDefaults.Web);\n        options.Converters.Add(new JsonStringEnumConverter());\n        return options;\n    }\n'''
          if old not in text:
              raise SystemExit("Expected JsonOptions declaration not found")
          path.write_text(text.replace(old, new, 1))
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/BookingAmendmentEndpoints.cs
          git diff --cached --exit-code && { echo "No changes"; exit 1; } || true
          git commit -m "VS-25: serialize audit occupancy as stable enum names"
          git push origin HEAD:slice/vs25-operator-booking-amendments-traveller-management
