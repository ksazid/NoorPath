name: VS-37 Pay Full Test Fix One-shot

on:
  push:
    branches:
      - agent/vs37-package-booking-composition

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs37-package-booking-composition
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Align tests with Pay Full default
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/e2e/package-details.spec.ts')
          text = p.read_text()

          stale_due = '  await expect(page.getByText("₹44,000").first()).toBeVisible();\n'
          stale_remaining = '  await expect(page.getByText("₹1,76,000").first()).toBeVisible();\n'
          if stale_due not in text or stale_remaining not in text:
              raise SystemExit('Default milestone assertions not found')
          text = text.replace(stale_due, '', 1)
          text = text.replace(stale_remaining, '', 1)

          mobile_stale = '  await expect(page.getByText("₹44,000").first()).toBeVisible();\n'
          mobile_replacement = '''  await expect(page.getByRole("radio", { name: /Pay Full/ })).toBeChecked();
          await expect(
            page.locator(".package-payment-breakdown").getByText("₹2,20,000"),
          ).toBeVisible();
          '''
          if mobile_stale not in text:
              raise SystemExit('Mobile milestone assertion not found')
          text = text.replace(mobile_stale, mobile_replacement, 1)
          p.write_text(text)
          PY
      - name: Format test
        run: pnpm --dir apps/web exec prettier --write 'e2e/package-details.spec.ts'
      - name: Commit test correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/e2e/package-details.spec.ts
          git commit -m 'VS-37 certify Pay Full default in package tests'
          git push origin HEAD:agent/vs37-package-booking-composition
