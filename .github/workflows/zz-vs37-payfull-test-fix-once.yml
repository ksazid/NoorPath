name: VS-37 Pay Full Test Fix One-shot

on:
  push:
    branches:
      - agent/vs37-package-booking-composition

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs37-package-booking-composition
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Align tests with Pay Full default
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/e2e/package-details.spec.ts')
          text = p.read_text()
          old = '''  await expect(page.getByText("₹2,20,000").first()).toBeVisible();
          await expect(page.getByText("₹44,000").first()).toBeVisible();
          await expect(page.getByText("₹1,76,000").first()).toBeVisible();
          await expect(page.getByRole("radio", { name: /Pay Full/ })).toBeChecked();'''
          new = '''  await expect(page.getByRole("radio", { name: /Pay Full/ })).toBeChecked();
          await expect(page.getByText("₹2,20,000").first()).toBeVisible();
          await expect(
            page.locator(".package-payment-breakdown").getByText("₹2,20,000"),
          ).toBeVisible();'''
          if old not in text:
              raise SystemExit('Primary Pay Full assertion block not found')
          text = text.replace(old, new, 1)
          old = '  await expect(page.getByText("₹44,000").first()).toBeVisible();\n  await expect(\n    page.getByRole("link", { name: /Book now/ }).first(),\n  ).toBeVisible();'
          new = '  await expect(page.getByRole("radio", { name: /Pay Full/ })).toBeChecked();\n  await expect(\n    page.locator(".package-payment-breakdown").getByText("₹2,20,000"),\n  ).toBeVisible();\n  await expect(\n    page.getByRole("link", { name: /Book now/ }).first(),\n  ).toBeVisible();'
          if old not in text:
              raise SystemExit('Mobile Pay Full assertion block not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Format test
        run: pnpm --dir apps/web exec prettier --write 'e2e/package-details.spec.ts'
      - name: Commit test correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/e2e/package-details.spec.ts
          git commit -m 'VS-37 certify Pay Full default in package tests'
          git push origin HEAD:agent/vs37-package-booking-composition
