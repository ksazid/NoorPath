name: VS-07 Rendered Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rendered-review:
    name: Plan journey rendered review
    runs-on: ${{ github.event.pull_request.number == 41 && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      ASPNETCORE_ENVIRONMENT: Test
      Authentication__Mode: Test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Configure self-hosted .NET install directory
        if: github.event.pull_request.number == 41
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/.dotnet" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile

      - name: Install rendered review browsers and dependencies
        run: pnpm --dir apps/web exec playwright install --with-deps chromium webkit

      - name: Run VS-07 rendered acceptance
        run: pnpm --dir apps/web exec playwright test e2e/plan-journey.spec.ts

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs07-rendered-review
          if-no-files-found: warn
          path: |
            apps/web/test-results
            apps/web/playwright-report
