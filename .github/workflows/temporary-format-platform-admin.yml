name: Temporary Platform Admin Formatter

on:
  push:
    branches:
      - agent/platform-admin-shell-alignment

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/platform-admin-shell-alignment
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format Platform Admin files
        run: |
          pnpm --dir apps/web exec prettier --write \
            app/admin/PlatformAdminWorkspaceShell.tsx \
            app/platform-admin-shell.css \
            e2e/platform-admin-shell.spec.ts \
            e2e/platform-publication-approval.spec.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/admin/PlatformAdminWorkspaceShell.tsx \
            apps/web/app/platform-admin-shell.css \
            apps/web/e2e/platform-admin-shell.spec.ts \
            apps/web/e2e/platform-publication-approval.spec.ts
          git commit -m "Format platform admin shell changes"
          git push origin HEAD:agent/platform-admin-shell-alignment
