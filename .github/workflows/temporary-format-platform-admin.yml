name: Temporary Platform Admin Formatter

on:
  push:
    branches:
      - agent/vs34-platform-admin-shell-alignment

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs34-platform-admin-shell-alignment
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format certified VS34 test
        run: pnpm --dir apps/web exec prettier --write e2e/platform-operator-administration.spec.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/platform-operator-administration.spec.ts
          git commit -m "Format VS34 admin shell certification test"
          git push origin HEAD:agent/vs34-platform-admin-shell-alignment
