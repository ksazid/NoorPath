name: VS-37 Payment Layout Fix One-shot

on:
  push:
    branches:
      - agent/vs37-package-booking-composition

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs37-package-booking-composition
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Improve desktop payment-option readability
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/app/packages/[departureId]/package-conversion.css')
          text = p.read_text()
          old = '.package-payment-mode-options {\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n}\n\n.package-payment-mode label {\n  align-content: start;\n  min-height: 104px;\n}'
          new = '.package-payment-mode-options {\n  grid-template-columns: 1fr;\n}\n\n.package-payment-mode label {\n  align-content: center;\n  min-height: 72px;\n}'
          if old not in text:
              raise SystemExit('VS-37 payment layout override not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Format and design-check
        run: |
          pnpm --dir apps/web exec prettier --write 'app/packages/[departureId]/package-conversion.css'
          node .agents/skills/impeccable/scripts/detect.mjs --json 'apps/web/app/packages/[departureId]/page.tsx' 'apps/web/app/packages/[departureId]/package-conversion.css'
      - name: Commit layout correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/packages/'[departureId]'/package-conversion.css
          git commit -m 'VS-37 improve payment option readability'
          git push origin HEAD:agent/vs37-package-booking-composition
