name: Navigation script formatter

on:
  push:
    branches:
      - docs/navigation-verification-gate
    paths:
      - .github/workflows/navigation-script-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/navigation-verification-gate
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec prettier --write ../../scripts/navigation-verification.mjs
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/navigation-verification.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format navigation verification script"
          git push origin HEAD:docs/navigation-verification-gate
