name: VS-16 Frontend Format

on:
  push:
    branches:
      - codex/vs16-cancellation-refunds-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vs16-cancellation-refunds-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Correct malformed JSX and format changed frontend files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/operator/cancellations/page.tsx')
          text = path.read_text()
          malformed = 'Maximum authorized entitlement:{" \n'
          if malformed not in text:
              raise SystemExit('Expected malformed JSX token was not found')
          path.write_text(text.replace(malformed, 'Maximum authorized entitlement:{" "}\n', 1))
          PY
          pnpm --dir apps/web exec prettier --write \
            'app/bookings/[bookingId]/journey/CancellationPanel.tsx' \
            'app/operator/cancellations/page.tsx' \
            'e2e/cancellation-refunds.spec.ts'
          pnpm --dir apps/web exec prettier --check \
            'app/bookings/[bookingId]/journey/CancellationPanel.tsx' \
            'app/operator/cancellations/page.tsx' \
            'e2e/cancellation-refunds.spec.ts'
      - name: Commit canonical formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/app/bookings/'[bookingId]'/journey/CancellationPanel.tsx apps/web/app/operator/cancellations/page.tsx apps/web/e2e/cancellation-refunds.spec.ts
          git commit -m "VS-16: format cancellation and refund frontend"
          git pull --rebase origin codex/vs16-cancellation-refunds-runtime
          git push origin HEAD:codex/vs16-cancellation-refunds-runtime
