name: VS-37 Detector Cleanup One-shot

on:
  push:
    branches:
      - agent/vs37-package-booking-composition

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs37-package-booking-composition
      - name: Remove legacy side-tab borders in touched surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          fixes = {
            "apps/web/app/packages/[departureId]/package-conversion.css": (
              "border-left: 3px solid var(--package-surface);",
              "border-left: 1px solid var(--public-line);",
            ),
            "apps/web/app/plan.css": (
              "border-left: 3px solid var(--public-gold);",
              "border: 1px solid var(--public-line);",
            ),
          }
          for path, (old, new) in fixes.items():
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected legacy border not found: {path}")
              p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/packages/'[departureId]'/package-conversion.css apps/web/app/plan.css
          git commit -m 'VS-37 remove legacy side-tab accents'
          git push origin HEAD:agent/vs37-package-booking-composition
