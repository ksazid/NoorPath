name: VS-14 Canonical Format

on:
  push:
    branches:
      - codex/vs-14-operational-support

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vs-14-operational-support
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier output
        run: |
          pnpm --dir apps/web exec prettier --write \
            app/operator/support/page.tsx \
            e2e/operational-support.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/operator/support/page.tsx apps/web/e2e/operational-support.spec.ts
          git commit -m "style: apply canonical VS-14 formatting"
          git push origin HEAD:codex/vs-14-operational-support
