name: VS-28 Fix CI Blockers

on:
  push:
    branches:
      - slice/vs28-final-departure-handover-readiness
    paths:
      - .github/workflows/vs28-fix-ci-blockers.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/vs28-final-departure-handover-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: pnpm --dir apps/web exec prettier --write e2e/operator-departure-handover.spec.ts
      - name: Migrate readiness source schemas in VS-28 integration fixture
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/NoorPath.Commercial.Integration.Tests/OperatorDepartureHandoverApiTests.cs")
          text = path.read_text()

          text = text.replace(
              "using NoorPath.Booking.Infrastructure;\n",
              "using NoorPath.Booking.Infrastructure;\nusing NoorPath.Documents.Infrastructure;\nusing NoorPath.Visa.Infrastructure;\n",
              1,
          )

          create = """        await using var app = await OperatorBookingAmendmentApi.CreateAsync(\n            TestContext.Current.CancellationToken);\n"""
          replacement = create + """        await EnsureReadinessSchemasAsync(app, TestContext.Current.CancellationToken);\n"""
          text = text.replace(create, replacement)

          marker = "\n}\n"
          helper = """

    private static async Task EnsureReadinessSchemasAsync(
        OperatorBookingAmendmentApi app,
        CancellationToken cancellationToken)
    {
        await using var scope = app.Services.CreateAsyncScope();
        var documents = scope.ServiceProvider.GetRequiredService<DocumentsDbContext>();
        var visa = scope.ServiceProvider.GetRequiredService<VisaDbContext>();
        await documents.Database.MigrateAsync(cancellationToken);
        await visa.Database.MigrateAsync(cancellationToken);
    }
"""
          index = text.find(marker)
          if index < 0:
              raise SystemExit("Could not locate test-class closing brace")
          text = text[:index] + helper + text[index:]
          path.write_text(text)
      - name: Remove temporary workflow
        run: rm .github/workflows/vs28-fix-ci-blockers.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/operator-departure-handover.spec.ts tests/NoorPath.Commercial.Integration.Tests/OperatorDepartureHandoverApiTests.cs .github/workflows/vs28-fix-ci-blockers.yml
          git diff --cached --check
          git commit -m "VS-28: fix certification CI blockers"
          git push origin HEAD:slice/vs28-final-departure-handover-readiness