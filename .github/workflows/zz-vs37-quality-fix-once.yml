name: VS-37 Quality Fix One-shot

on:
  push:
    branches:
      - agent/vs37-package-booking-composition

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs37-package-booking-composition
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply quality fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          plan = Path("apps/web/app/packages/[departureId]/plan/page.tsx")
          text = plan.read_text()
          old = 'import { FormEvent, useCallback, useEffect, useState } from "react";'
          new = 'import { FormEvent, useCallback, useEffect, useId, useState } from "react";'
          if old not in text:
              raise SystemExit("React import block not found")
          text = text.replace(old, new, 1)

          old = '''function SignInNotice({ action = "create your quote" }: { action?: string }) {\n  const [mobile, setMobile] = useState("");\n  const [showCodePreview, setShowCodePreview] = useState(false);'''
          new = '''function SignInNotice({ action = "create your quote" }: { action?: string }) {\n  const id = useId();\n  const headingId = `${id}-phone-auth-title`;\n  const mobileId = `${id}-mobile-number`;\n  const otpId = `${id}-otp-code`;\n  const [mobile, setMobile] = useState("");\n  const [showCodePreview, setShowCodePreview] = useState(false);'''
          if old not in text:
              raise SystemExit("SignInNotice state block not found")
          text = text.replace(old, new, 1)
          text = text.replace('aria-labelledby="phone-auth-title"', 'aria-labelledby={headingId}', 1)
          text = text.replace('id="phone-auth-title"', 'id={headingId}', 1)
          text = text.replace('htmlFor="booking-mobile-number"', 'htmlFor={mobileId}', 1)
          text = text.replace('id="booking-mobile-number"', 'id={mobileId}', 1)
          text = text.replace('htmlFor="booking-otp-code"', 'htmlFor={otpId}', 1)
          text = text.replace('id="booking-otp-code"', 'id={otpId}', 1)
          text = text.replace('event.target.value.replace(/\\\\D/g, "")', 'event.target.value.replace(/\\D/g, "")', 1)
          plan.write_text(text)

          checklist = Path("docs/slices/VS-37-IMPLEMENTATION-CHECKLIST.md")
          text = checklist.read_text()
          text = text.replace('- [ ] Run formatter and Impeccable final detector.', '- [x] Run formatter and Impeccable final detector.', 1)
          checklist.write_text(text)
          PY
      - name: Format and verify design detector
        run: |
          pnpm --dir apps/web exec prettier --write 'app/packages/[departureId]/plan/page.tsx'
          node .agents/skills/impeccable/scripts/detect.mjs --json 'apps/web/app/packages/[departureId]/page.tsx' 'apps/web/app/packages/[departureId]/package-conversion.css' 'apps/web/app/packages/[departureId]/plan/page.tsx' 'apps/web/app/plan.css'
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/packages/'[departureId]'/plan/page.tsx docs/slices/VS-37-IMPLEMENTATION-CHECKLIST.md
          git commit -m 'VS-37 harden OTP preview semantics'
          git push origin HEAD:agent/vs37-package-booking-composition
