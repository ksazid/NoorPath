name: VS-37 Implementation One-shot

on:
  push:
    branches:
      - agent/vs37-package-booking-composition

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vs37-package-booking-composition
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply VS-37
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_section(path, start, end, new):
              p = Path(path)
              text = p.read_text()
              a = text.index(start)
              b = text.index(end, a)
              p.write_text(text[:a] + new.rstrip() + "\n\n" + text[b:])

          page = "apps/web/app/packages/[departureId]/page.tsx"
          replace_once(
              page,
              'import { useCallback, useEffect, useState } from "react";',
              'import { useCallback, useEffect, useRef, useState } from "react";'
          )

          package_experience = r'''function PackageExperience({ details }: { details: PackageDetails }) {
            const firstAvailable = details.pricing.occupancies.find(
              (item) => item.status === "available",
            );
            const [occupancy, setOccupancy] = useState<Occupancy>(
              firstAvailable?.occupancy ?? "double",
            );
            const [paymentMode, setPaymentMode] = useState<PaymentMode>("pay-full");
            const selected =
              details.pricing.occupancies.find(
                (item) => item.occupancy === occupancy && item.status === "available",
              ) ?? firstAvailable;

            if (!selected) {
              return (
                <main className="package-main" id="main-content">
                  <PackageUnavailable />
                </main>
              );
            }

            return (
              <>
                <main className="package-main package-conversion-main" id="main-content">
                  <nav className="package-breadcrumbs" aria-label="Breadcrumb">
                    <Link href="/">Home</Link>
                    <span aria-hidden="true">›</span>
                    <Link href="/#packages">Umrah Packages</Link>
                    <span aria-hidden="true">›</span>
                    <span>{details.packageName}</span>
                  </nav>

                  <section className="package-purchase-layout" aria-labelledby="package-title">
                    <div className="package-story-hero">
                      <Gallery selected={selected} />
                      <OperatorSummary details={details} />
                    </div>

                    <BookingCard
                      details={details}
                      selected={selected}
                      paymentMode={paymentMode}
                      onOccupancyChange={setOccupancy}
                      onPaymentModeChange={setPaymentMode}
                    />

                    <Journey details={details} />
                    <PackageContent details={details} />
                    <TrustAndTerms details={details} />

                    <section className="package-conversion-about">
                      <h2>About this package</h2>
                      <p>{details.summary}</p>
                      <p>
                        Published pricing, current room availability and payment commitments
                        are visible before you start booking.
                      </p>
                    </section>
                  </section>
                </main>

                <PublicFooter />
                <StickyBookingBar
                  details={details}
                  selected={selected}
                  paymentMode={paymentMode}
                />
              </>
            );
          }'''
          replace_section(page, "function PackageExperience", "function TravelDates", package_experience)

          travel_dates = r'''function TravelDates({ details }: { details: PackageDetails }) {
            const scrollerRef = useRef<HTMLDivElement>(null);
            const dates = details.travelDates?.length
              ? details.travelDates
              : [
                  {
                    departureId: details.departureId,
                    departureDate: details.departureDate,
                    returnDate: details.returnDate,
                    status: "available" as const,
                  },
                ];

            const moveDates = (direction: -1 | 1) => {
              scrollerRef.current?.scrollBy({ left: direction * 196, behavior: "auto" });
            };

            return (
              <section
                className="package-travel-dates package-travel-dates-inline"
                aria-labelledby="travel-dates-title"
              >
                <div className="package-travel-dates-heading">
                  <div>
                    <h3 id="travel-dates-title">Available Travel Dates</h3>
                    <p>Published departures from {details.origin}</p>
                  </div>
                  <div className="package-date-nav" aria-label="Travel date controls">
                    <button type="button" aria-label="Previous travel dates" onClick={() => moveDates(-1)}>
                      <Icon name="caret-down" />
                    </button>
                    <button type="button" aria-label="Next travel dates" onClick={() => moveDates(1)}>
                      <Icon name="caret-down" />
                    </button>
                  </div>
                </div>
                <div
                  className="package-date-scroller"
                  ref={scrollerRef}
                  aria-label={`Published ${details.origin} travel dates`}
                >
                  {dates.map((option) => {
                    const current = option.departureId === details.departureId;
                    const soldOut = option.status === "sold-out";
                    const content = (
                      <>
                        <span className="package-date-card-topline">
                          <Icon name="airplane-tilt" />
                          <small>{current ? "Selected" : details.origin}</small>
                          {soldOut ? <em>Sold out</em> : null}
                        </span>
                        <strong>{formatDate(option.departureDate)}</strong>
                        <span>{formatDate(option.returnDate)} return</span>
                      </>
                    );

                    return soldOut && !current ? (
                      <article
                        className="package-date-card sold-out"
                        aria-label={`${formatDate(option.departureDate)} sold out`}
                        key={option.departureId}
                      >
                        {content}
                      </article>
                    ) : (
                      <Link
                        className={`package-date-card${current ? " current" : ""}`}
                        aria-current={current ? "page" : undefined}
                        href={`/packages/${option.departureId}`}
                        key={option.departureId}
                      >
                        {content}
                      </Link>
                    );
                  })}
                </div>
              </section>
            );
          }'''
          replace_section(page, "function TravelDates", "function Gallery", travel_dates)

          booking_card = r'''function BookingCard({
            details,
            selected,
            paymentMode,
            onOccupancyChange,
            onPaymentModeChange,
          }: {
            details: PackageDetails;
            selected: OccupancyDetail;
            paymentMode: PaymentMode;
            onOccupancyChange: (value: Occupancy) => void;
            onPaymentModeChange: (value: PaymentMode) => void;
          }) {
            const financials = selected.financials;
            const hasFuturePlan =
              financials.remaining > 0 &&
              financials.instalments.length > 0 &&
              financials.finalDueDate !== null;
            const effectivePaymentMode: PaymentMode = hasFuturePlan
              ? paymentMode
              : "pay-full";
            const visibleFinancials = paymentPreview(financials, effectivePaymentMode);
            const zeroDiscount = formatMoney(0, details.pricing.currency);

            return (
              <aside
                className="package-booking-card"
                aria-label="Booking and payment summary"
              >
                <div className="package-booking-heading">
                  <h2>Plan your booking</h2>
                  <p>Choose the journey details and review the full price before Book now.</p>
                </div>

                <TravelDates details={details} />

                <GuestSelector
                  details={details}
                  selected={selected}
                  onOccupancyChange={onOccupancyChange}
                />

                <fieldset className="package-room-options">
                  <legend>Room Sharing</legend>
                  {details.pricing.occupancies.map((item) => (
                    <label
                      className={`package-room-option${selected.occupancy === item.occupancy ? " selected" : ""}${item.status !== "available" ? " unavailable" : ""}`}
                      key={item.occupancy}
                    >
                      <input
                        type="radio"
                        name="package-occupancy"
                        checked={selected.occupancy === item.occupancy}
                        disabled={item.status !== "available"}
                        onChange={() => onOccupancyChange(item.occupancy)}
                      />
                      <span>
                        <strong>{occupancyLabel(item.occupancy)}</strong>
                        <small>
                          {item.status === "available"
                            ? `${item.availableQuantity} available`
                            : "Currently unavailable"}
                        </small>
                      </span>
                      <strong>
                        {formatMoney(item.amount, details.pricing.currency)}
                        <small>/ person</small>
                      </strong>
                    </label>
                  ))}
                </fieldset>

                <fieldset className="package-payment-mode">
                  <legend>Payment Options</legend>
                  <div className="package-payment-mode-options">
                    <label
                      className={effectivePaymentMode === "pay-full" ? "selected" : ""}
                    >
                      <input
                        type="radio"
                        name="payment-mode"
                        checked={effectivePaymentMode === "pay-full"}
                        onChange={() => onPaymentModeChange("pay-full")}
                      />
                      <span>
                        <strong>Pay Full</strong>
                        <small>Pay the complete package amount today</small>
                      </span>
                    </label>
                    {hasFuturePlan ? (
                      <>
                        <label
                          className={
                            effectivePaymentMode === "milestone" ? "selected" : ""
                          }
                        >
                          <input
                            type="radio"
                            name="payment-mode"
                            checked={effectivePaymentMode === "milestone"}
                            onChange={() => onPaymentModeChange("milestone")}
                          />
                          <span>
                            <strong>Milestone</strong>
                            <small>Pay in published stages before departure</small>
                          </span>
                        </label>
                        <label
                          className={
                            effectivePaymentMode === "pay-later" ? "selected" : ""
                          }
                        >
                          <input
                            type="radio"
                            name="payment-mode"
                            checked={effectivePaymentMode === "pay-later"}
                            onChange={() => onPaymentModeChange("pay-later")}
                          />
                          <span>
                            <strong>Pay Later</strong>
                            <small>Minimum today, remaining balance by final deadline</small>
                          </span>
                        </label>
                      </>
                    ) : null}
                  </div>
                </fieldset>

                <PaymentBreakdown
                  financials={financials}
                  currency={details.pricing.currency}
                  mode={effectivePaymentMode}
                />

                <section className="package-price-breakdown" aria-labelledby="price-breakdown-title">
                  <h3 id="price-breakdown-title">Price Breakdown</h3>
                  <dl>
                    <div>
                      <dt>Airline</dt>
                      <dd className="package-price-pending">To be confirmed</dd>
                    </div>
                    <div>
                      <dt>Departure Route</dt>
                      <dd>{details.travel.routeSummary}</dd>
                    </div>
                    <div>
                      <dt>Return Route</dt>
                      <dd>To be confirmed · {formatDate(details.returnDate)}</dd>
                    </div>
                    <div className="package-price-unit">
                      <dt>
                        {formatMoney(selected.amount, details.pricing.currency)} × {financials.adultGuests}
                        <small>({occupancyLabel(selected.occupancy)}, {financials.adultGuests} adults)</small>
                      </dt>
                      <dd>{formatMoney(financials.total, details.pricing.currency)}</dd>
                    </div>
                    <div>
                      <dt>Total Price Before Discount</dt>
                      <dd>{formatMoney(financials.total, details.pricing.currency)}</dd>
                    </div>
                    <div className="package-discount-row">
                      <dt>
                        Discount
                        <small>No published discount</small>
                      </dt>
                      <dd><span>0%</span> {zeroDiscount}</dd>
                    </div>
                    <div>
                      <dt>Total Price After Discount</dt>
                      <dd>{formatMoney(financials.total, details.pricing.currency)}</dd>
                    </div>
                    <div>
                      <dt>Service Provider</dt>
                      <dd>{details.operator.displayName}</dd>
                    </div>
                    <div>
                      <dt>Powered &amp; Supported by</dt>
                      <dd>NoorPath</dd>
                    </div>
                    <div className="package-payment-commitment-row">
                      <dt>Pay today · {paymentModeLabel(effectivePaymentMode)}</dt>
                      <dd>{formatMoney(visibleFinancials.dueNow, details.pricing.currency)}</dd>
                    </div>
                    <div className="package-payment-commitment-row">
                      <dt>Remaining</dt>
                      <dd>{formatMoney(visibleFinancials.remaining, details.pricing.currency)}</dd>
                    </div>
                    <div className="package-grand-total">
                      <dt>TOTAL</dt>
                      <dd>{formatMoney(financials.total, details.pricing.currency)}</dd>
                    </div>
                  </dl>
                  <p className="package-tax-note">
                    Any applicable taxes or statutory charges will be shown before payment.
                  </p>
                </section>

                {!hasFuturePlan ? (
                  <p className="package-full-payment">
                    <Icon name="receipt" /> This departure is published as full payment only.
                  </p>
                ) : null}

                <p className="package-payment-note">
                  Price and availability are rechecked before a place is reserved.
                </p>
                <Link
                  className="package-book-now"
                  href={bookingHref(
                    details.departureId,
                    selected.occupancy,
                    effectivePaymentMode,
                  )}
                >
                  Book now <span aria-hidden="true">›</span>
                </Link>
              </aside>
            );
          }'''
          replace_section(page, "function BookingCard", "function GuestSelector", booking_card)

          replace_once(
              page,
              '''function occupancyLabel(occupancy: Occupancy) {''',
              '''function paymentModeLabel(mode: PaymentMode) {
                return mode === "pay-full"
                  ? "Pay Full"
                  : mode === "milestone"
                    ? "Milestone"
                    : "Pay Later";
              }

              function occupancyLabel(occupancy: Occupancy) {'''
          )

          css = Path("apps/web/app/packages/[departureId]/package-conversion.css")
          css.write_text(css.read_text() + r'''

          /* VS-37: purchase-decision composition */
          .package-purchase-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.55fr) minmax(360px, 0.76fr);
            grid-template-areas:
              "hero booking"
              "journey booking"
              "content booking"
              "status booking"
              "about booking";
            gap: 24px 30px;
            align-items: start;
          }

          .package-story-hero {
            grid-area: hero;
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(260px, 0.75fr);
            gap: 24px;
            align-items: stretch;
          }

          .package-story-hero .package-conversion-gallery {
            min-height: 430px;
          }

          .package-story-hero .package-conversion-operator {
            padding-block: 10px;
          }

          .package-purchase-layout > .package-booking-card {
            grid-area: booking;
          }

          .package-purchase-layout > .package-conversion-journey {
            grid-area: journey;
          }

          .package-purchase-layout > .package-conversion-features {
            grid-area: content;
          }

          .package-purchase-layout > .package-conversion-status {
            grid-area: status;
          }

          .package-purchase-layout > .package-conversion-about {
            grid-area: about;
            margin-top: 0;
          }

          .package-purchase-layout .package-conversion-features,
          .package-purchase-layout .package-conversion-status {
            gap: 16px;
          }

          .package-purchase-layout .package-content-grid ul {
            grid-template-columns: repeat(4, minmax(0, 1fr));
          }

          .package-booking-card {
            box-shadow: 0 12px 30px rgb(52 39 23 / 6%);
          }

          .package-booking-card .package-travel-dates {
            margin: 0 0 18px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--public-line);
          }

          .package-booking-card .package-travel-dates-heading {
            align-items: center;
            margin-bottom: 10px;
          }

          .package-booking-card .package-travel-dates-heading h3 {
            margin: 0;
            color: var(--public-ink);
            font-size: 0.9375rem;
            font-weight: 700;
          }

          .package-booking-card .package-travel-dates-heading p {
            margin: 3px 0 0;
            color: var(--public-muted);
            font-size: 0.75rem;
            line-height: 1.4;
          }

          .package-date-nav {
            display: flex;
            gap: 8px;
          }

          .package-date-nav button {
            display: grid;
            width: 44px;
            height: 44px;
            place-items: center;
            padding: 0;
            border: 1px solid var(--public-line);
            border-radius: 50%;
            background: var(--package-surface);
            color: var(--public-ink);
            cursor: pointer;
            transition:
              border-color 140ms var(--package-ease-out),
              transform 120ms var(--package-ease-out);
          }

          .package-date-nav .public-icon {
            width: 18px;
            height: 18px;
          }

          .package-date-nav button:first-child .public-icon {
            transform: rotate(90deg);
          }

          .package-date-nav button:last-child .public-icon {
            transform: rotate(-90deg);
          }

          .package-booking-card .package-date-scroller {
            gap: 8px;
            padding-bottom: 4px;
            scrollbar-width: none;
          }

          .package-booking-card .package-date-scroller::-webkit-scrollbar {
            display: none;
          }

          .package-booking-card .package-date-card {
            min-width: 178px;
            min-height: 98px;
            flex-basis: 178px;
            padding: 12px 13px;
          }

          .package-payment-mode-options {
            grid-template-columns: repeat(3, minmax(0, 1fr));
          }

          .package-payment-mode label {
            align-content: start;
            min-height: 104px;
          }

          .package-price-breakdown {
            margin-top: 20px;
            padding-top: 20px;
          }

          .package-price-breakdown h3 {
            margin-bottom: 14px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.35rem;
            font-weight: 500;
          }

          .package-price-breakdown dl {
            gap: 0;
          }

          .package-price-breakdown dl > div {
            align-items: start;
            min-height: 46px;
            padding: 10px 0;
            border-bottom: 1px solid color-mix(in srgb, var(--public-line) 72%, transparent);
            font-size: 0.8125rem;
          }

          .package-price-breakdown dt {
            min-width: 0;
          }

          .package-price-breakdown dt small {
            display: block;
            margin-top: 3px;
            color: var(--public-muted);
            font-size: 0.6875rem;
            font-weight: 400;
          }

          .package-price-breakdown dd {
            max-width: 58%;
            overflow-wrap: anywhere;
          }

          .package-price-pending {
            color: var(--public-muted) !important;
            font-weight: 600 !important;
          }

          .package-price-unit {
            padding-block: 13px !important;
          }

          .package-discount-row dd,
          .package-discount-row dd span {
            color: var(--public-green-deep);
          }

          .package-discount-row dd span {
            margin-right: 6px;
            font-weight: 800;
          }

          .package-payment-commitment-row {
            background: color-mix(in srgb, var(--package-success-soft) 60%, transparent);
          }

          .package-payment-commitment-row dt,
          .package-payment-commitment-row dd {
            color: var(--public-green-deep);
            font-weight: 700;
          }

          .package-grand-total {
            min-height: 62px !important;
            align-items: center !important;
            margin-top: 6px;
            padding-top: 16px !important;
            border-top: 1px solid var(--public-ink);
            border-bottom: 0 !important;
            color: var(--public-ink) !important;
          }

          .package-grand-total dt {
            font-size: 1rem;
            font-weight: 800;
          }

          .package-grand-total dd {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.55rem;
            font-weight: 700;
          }

          .package-tax-note {
            margin: 10px 0 0;
            color: var(--public-muted);
            font-size: 0.75rem;
            line-height: 1.5;
            text-align: center;
          }

          .package-date-nav button:focus-visible {
            outline: 3px solid var(--public-gold);
            outline-offset: 3px;
          }

          .package-date-nav button:active {
            transform: scale(0.97);
          }

          @media (hover: hover) {
            .package-date-nav button:hover {
              border-color: var(--public-green);
            }
          }

          @media (max-width: 1120px) {
            .package-purchase-layout {
              grid-template-columns: minmax(0, 1.3fr) minmax(340px, 0.8fr);
              gap: 22px;
            }

            .package-story-hero {
              grid-template-columns: 1fr;
            }

            .package-story-hero .package-conversion-gallery {
              min-height: 380px;
            }
          }

          @media (max-width: 900px) {
            .package-purchase-layout {
              grid-template-columns: 1fr;
              grid-template-areas:
                "hero"
                "booking"
                "journey"
                "content"
                "status"
                "about";
              gap: 18px;
            }

            .package-story-hero {
              gap: 14px;
            }

            .package-story-hero .package-conversion-gallery {
              min-height: 330px;
            }

            .package-payment-mode-options {
              grid-template-columns: 1fr;
            }

            .package-payment-mode label {
              min-height: 72px;
            }

            .package-purchase-layout .package-content-grid ul {
              grid-template-columns: repeat(3, minmax(0, 1fr));
            }
          }

          @media (max-width: 520px) {
            .package-booking-card {
              padding: 16px;
            }

            .package-booking-card .package-travel-dates-heading {
              gap: 10px;
            }

            .package-booking-card .package-travel-dates-heading p {
              font-size: 0.8125rem;
            }

            .package-booking-card .package-date-card {
              min-width: 168px;
              flex-basis: 168px;
            }

            .package-purchase-layout .package-content-grid ul {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .package-price-breakdown dl > div {
              gap: 12px;
              font-size: 0.875rem;
            }

            .package-price-breakdown dd {
              max-width: 54%;
            }
          }

          @media (prefers-reduced-motion: reduce) {
            .package-date-nav button {
              transition-duration: 0.01ms;
            }
          }
          ''')

          plan = "apps/web/app/packages/[departureId]/plan/page.tsx"
          replace_once(plan, 'const [paymentMode, setPaymentMode] = useState<PaymentMode>("milestone");', 'const [paymentMode, setPaymentMode] = useState<PaymentMode>("pay-full");')
          replace_once(plan, '          : "milestone",', '          : "pay-full",')
          replace_once(
              plan,
              '  const [savingTraveller, setSavingTraveller] = useState(false);',
              '  const [savingTraveller, setSavingTraveller] = useState(false);\n  const [showTravellerForm, setShowTravellerForm] = useState(false);'
          )
          replace_once(
              plan,
              '      setDateOfBirth("");\n      if (',
              '      setDateOfBirth("");\n      setShowTravellerForm(false);\n      if ('
          )

          plan_text = Path(plan).read_text()
          plan_text = plan_text.replace(
              '''                                <span>\n                                  <strong>{traveller.fullName}</strong>\n                                  <small>\n                                    Born {formatDate(traveller.dateOfBirth)}\n                                  </small>\n                                </span>''',
              '''                                <span>\n                                  <strong>{traveller.fullName}</strong>\n                                </span>'''
          )
          form_pattern = re.compile(r'''\n\s*<form\n\s*className="traveller-add-form"\n\s*onSubmit=\{addTraveller\}\n\s*>.*?</form>''', re.S)
          form_replacement = r'''

                      <button
                        className="traveller-add-toggle"
                        type="button"
                        disabled={selectionLocked}
                        aria-expanded={showTravellerForm}
                        onClick={() => setShowTravellerForm((value) => !value)}
                      >
                        <span aria-hidden="true">+</span> Add traveller
                      </button>

                      {showTravellerForm ? (
                        <form className="traveller-add-form" onSubmit={addTraveller}>
                          <div className="traveller-add-heading">
                            <strong>Add an adult traveller</strong>
                            <small>
                              Start with their name. Date of birth confirms adult eligibility before saving.
                            </small>
                          </div>
                          {travellerErrors.form ? (
                            <p className="field-error" role="alert">
                              {travellerErrors.form}
                            </p>
                          ) : null}
                          <label>
                            <span>Full name</span>
                            <input
                              type="text"
                              autoComplete="name"
                              value={fullName}
                              disabled={selectionLocked}
                              onChange={(event) => setFullName(event.target.value)}
