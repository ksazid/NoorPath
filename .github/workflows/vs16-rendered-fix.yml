name: VS-16 Rendered Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'codex/vs16-cancellation-refunds-runtime'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vs16-cancellation-refunds-runtime
      - name: Preserve feedback and fix target sizes
        run: |
          python - <<'PY'
          from pathlib import Path

          operator = Path("apps/web/app/operator/cancellations/page.tsx")
          text = operator.read_text()

          replacements = [
              (
                  '    setState({ kind: "loading" });\n    setFeedback("");\n    const params',
                  '    setState({ kind: "loading" });\n    const params',
                  "load feedback reset",
              ),
              (
                  '  async function openCase(cancellationId: string) {\n    setFeedback("");\n    setReason("");',
                  '  async function openCase(cancellationId: string) {\n    setReason("");',
                  "openCase feedback reset",
              ),
              (
                  '  async function applyFilter(event: FormEvent) {\n    event.preventDefault();\n    setDetail(null);',
                  '  async function applyFilter(event: FormEvent) {\n    event.preventDefault();\n    setFeedback("");\n    setDetail(null);',
                  "applyFilter",
              ),
              (
                  '                  onClick={() => void openCase(item.cancellationId)}',
                  '                  onClick={() => {\n                    setFeedback("");\n                    void openCase(item.cancellationId);\n                  }}',
                  "review case",
              ),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f"{label} target not found")
              text = text.replace(old, new, 1)
          operator.write_text(text)

          css = Path("apps/web/app/my-journey.css")
          styles = css.read_text()
          marker = ".journey-readiness p {\n  margin: 0;\n  color: var(--color-text-secondary);\n  line-height: 1.55;\n}\n"
          addition = marker + ".journey-readiness a {\n  display: inline-flex;\n  min-height: 44px;\n  align-items: center;\n  padding-block: 8px;\n}\n"
          if marker not in styles:
              raise SystemExit("journey readiness CSS target not found")
          css.write_text(styles.replace(marker, addition, 1))
          PY
          rm .github/workflows/vs16-rendered-fix.yml
      - name: Format changed web files
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir apps/web exec prettier --write \
            app/operator/cancellations/page.tsx \
            app/my-journey.css
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/operator/cancellations/page.tsx apps/web/app/my-journey.css .github/workflows/vs16-rendered-fix.yml
          git commit -m "fix(vs16): preserve governed feedback and target sizes"
          git push origin HEAD:codex/vs16-cancellation-refunds-runtime
