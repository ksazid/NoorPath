name: VS-16 Rendered Fix

on:
  push:
    branches:
      - codex/vs16-cancellation-refunds-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vs16-cancellation-refunds-runtime
      - name: Preserve feedback and fix target sizes
        run: |
          python - <<'PY'
          from pathlib import Path

          operator = Path("apps/web/app/operator/cancellations/page.tsx")
          text = operator.read_text()
          old_load = '''  const load = useCallback(async (selectedState = "") => {
              setState({ kind: "loading" });
              setFeedback("");
          '''
          new_load = '''  const load = useCallback(async (selectedState = "") => {
              setState({ kind: "loading" });
          '''
          if old_load not in text:
              raise SystemExit("load feedback reset target not found")
          text = text.replace(old_load, new_load, 1)

          old_open = '''  async function openCase(cancellationId: string) {
              setFeedback("");
              setReason("");
          '''
          new_open = '''  async function openCase(cancellationId: string) {
              setReason("");
          '''
          if old_open not in text:
              raise SystemExit("openCase feedback reset target not found")
          text = text.replace(old_open, new_open, 1)

          old_filter = '''  async function applyFilter(event: FormEvent) {
              event.preventDefault();
              setDetail(null);
              await load(filter);
          '''
          new_filter = '''  async function applyFilter(event: FormEvent) {
              event.preventDefault();
              setFeedback("");
              setDetail(null);
              await load(filter);
          '''
          if old_filter not in text:
              raise SystemExit("applyFilter target not found")
          text = text.replace(old_filter, new_filter, 1)

          old_review = '''                  onClick={() => void openCase(item.cancellationId)}
          '''
          new_review = '''                  onClick={() => {
                            setFeedback("");
                            void openCase(item.cancellationId);
                          }}
          '''
          if old_review not in text:
              raise SystemExit("review case target not found")
          text = text.replace(old_review, new_review, 1)
          operator.write_text(text)

          css = Path("apps/web/app/my-journey.css")
          styles = css.read_text()
          marker = '''.journey-readiness p {
            margin: 0;
            color: var(--color-text-secondary);
            line-height: 1.55;
          }
          '''
          addition = marker + '''.journey-readiness a {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            padding-block: 8px;
          }
          '''
          if marker not in styles:
              raise SystemExit("journey readiness CSS target not found")
          styles = styles.replace(marker, addition, 1)
          css.write_text(styles)
          PY
          rm .github/workflows/vs16-rendered-fix.yml
      - name: Format changed web files
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/web/app/operator/cancellations/page.tsx \
            apps/web/app/my-journey.css
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/operator/cancellations/page.tsx apps/web/app/my-journey.css .github/workflows/vs16-rendered-fix.yml
          git commit -m "fix(vs16): preserve governed feedback and target sizes"
          git push origin HEAD:codex/vs16-cancellation-refunds-runtime
