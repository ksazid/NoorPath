name: VS-26 format

on:
  push:
    branches:
      - slice/vs26-room-assignment-accommodation-operations
    paths:
      - .github/workflows/vs26-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/vs26-room-assignment-accommodation-operations
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Align room-level audit presentation
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/app/operator/OperatorAccommodation.tsx")
          text = path.read_text()
          text = text.replace(
              '    travellerId: string;\n    previousRoomId?: string | null;',
              '    travellerId?: string | null;\n    previousRoomId?: string | null;',
              1,
          )
          text = text.replace(
              'travellersById.get(item.travellerId)?.fullName ?? "Traveller"',
              'item.travellerId ? travellersById.get(item.travellerId)?.fullName ?? "Traveller" : "Room allocation"',
          )
          path.write_text(text)
      - name: Format changed implementation
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir apps/web exec prettier --write \
            app/layout.tsx \
            app/operator-accommodation.css \
            app/operator/OperatorAccommodation.tsx \
            app/operator/OperatorBookingDetail.tsx \
            'app/operator/bookings/[bookingId]/accommodation/page.tsx' \
            e2e/operator-accommodation.spec.ts
          dotnet restore NoorPath.slnx
          dotnet format NoorPath.slnx --no-restore --include \
            apps/api/AccommodationAssignmentEndpoints.cs \
            src/Modules/NoorPath.Booking/AccommodationAssignment.cs \
            src/Modules/NoorPath.Booking.Infrastructure/AccommodationRecords.cs \
            src/Modules/NoorPath.Booking.Infrastructure/BookingDbContext.cs \
            tests/NoorPath.Booking.Tests/AccommodationAssignmentPolicyTests.cs \
            tests/NoorPath.Commercial.Integration.Tests/OperatorAccommodationApiTests.cs
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/AccommodationAssignmentEndpoints.cs apps/web src/Modules/NoorPath.Booking src/Modules/NoorPath.Booking.Infrastructure tests/NoorPath.Booking.Tests/AccommodationAssignmentPolicyTests.cs tests/NoorPath.Commercial.Integration.Tests/OperatorAccommodationApiTests.cs
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "VS-26: format accommodation implementation"
          git push origin HEAD:slice/vs26-room-assignment-accommodation-operations
