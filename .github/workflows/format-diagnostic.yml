name: Format Diagnostic

on:
  push:
    branches:
      - slice/vs17-integrated-recertification

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: git diff > format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: format-diagnostic
          path: format.patch
