name: VS-32 drag fix

on:
  push:
    branches:
      - ux/vs32-package-inclusions-composer

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/vs32-package-inclusions-composer
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply drag fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/operator/packages/new/PackageInclusionsEditor.tsx')
          text = path.read_text()
          text = text.replace(
              '  const [dragOver, setDragOver] = useState<Destination | null>(null);\n  const [status, setStatus] = useState("");',
              '  const [dragOver, setDragOver] = useState<Destination | null>(null);\n  const [draggedItem, setDraggedItem] = useState<string | null>(null);\n  const [status, setStatus] = useState("");',
          )
          text = text.replace(
              '  const startDrag = (event: DragEvent<HTMLElement>, item: string) => {\n    event.dataTransfer.setData("text/plain", item);\n    event.dataTransfer.effectAllowed = "move";\n  };',
              '  const startDrag = (event: DragEvent<HTMLElement>, item: string) => {\n    setDraggedItem(item);\n    event.dataTransfer.setData("text/plain", item);\n    event.dataTransfer.effectAllowed = "move";\n  };',
          )
          text = text.replace(
              '    const item = event.dataTransfer.getData("text/plain");\n    setDragOver(null);\n    if (item) moveItem(item, destination);',
              '    const item = event.dataTransfer.getData("text/plain") || draggedItem;\n    setDragOver(null);\n    setDraggedItem(null);\n    if (item) moveItem(item, destination);',
          )
          text = text.replace(
              '                onDragStart={(event) => startDrag(event, item)}\n                key={item}',
              '                onDragStart={(event) => startDrag(event, item)}\n                onDragEnd={() => {\n                  setDragOver(null);\n                  setDraggedItem(null);\n                }}\n                key={item}',
          )
          path.write_text(text)
          PY
          pnpm --dir apps/web exec prettier --write app/operator/packages/new/PackageInclusionsEditor.tsx
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/operator/packages/new/PackageInclusionsEditor.tsx
          git commit -m "VS-32: make native drag transfer robust"
          git push origin HEAD:ux/vs32-package-inclusions-composer
