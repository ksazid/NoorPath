# Temporary branch-only normalizer; remove after one successful bot commit.
name: Normalize VS-03 commercial UI

on:
  push:
    branches:
      - vs03/pricing-inventory

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vs03/pricing-inventory
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Make draft badge include commercial edits
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/app/operator/departures/DepartureComposer.tsx")
          text = path.read_text()
          old = '''            {isDirty
              ? "Unsaved changes"
              : version'''
          new = '''            {hasUnsavedChanges
              ? "Unsaved changes"
              : version'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one draft badge match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed UI files
        run: >-
          pnpm --dir apps/web exec prettier --write
          app/operator/departures/CommercialEditor.tsx
          app/operator/departures/DepartureComposer.tsx
      - name: Commit deterministic UI normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/operator/departures/CommercialEditor.tsx apps/web/app/operator/departures/DepartureComposer.tsx
          git commit -m "Polish VS-03 commercial editor"
          git push origin HEAD:vs03/pricing-inventory
