name: VS-15 regenerate EF migration

on:
  push:
    branches:
      - codex/vs15-family-booking-mahram-runtime
    paths:
      - .github/workflows/vs15-regenerate-ef-migration.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: noorpath_family_booking_regeneration
          POSTGRES_USER: noorpath
          POSTGRES_PASSWORD: ci-local-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noorpath -d noorpath_family_booking_regeneration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOORPATH_FAMILY_BOOKING_TEST_DB: Host=127.0.0.1;Port=5432;Database=noorpath_family_booking_regeneration;Username=noorpath;Password=ci-local-only-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vs15-family-booking-mahram-runtime
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool install --global dotnet-ef --version 10.0.10
      - run: dotnet restore NoorPath.slnx
      - name: Replace handwritten migration with EF-generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          migration_dir="src/Modules/NoorPath.FamilyBooking.Infrastructure/Migrations"
          project="src/Modules/NoorPath.FamilyBooking.Infrastructure/NoorPath.FamilyBooking.Infrastructure.csproj"
          rm -rf "$migration_dir"
          mkdir -p "$migration_dir"
          dotnet ef migrations add VS15FamilyBooking \
            --project "$project" \
            --context FamilyBookingDbContext \
            --output-dir Migrations \
            --verbose

          snapshot="$migration_dir/FamilyBookingDbContextModelSnapshot.cs"
          designer="$(find "$migration_dir" -maxdepth 1 -name '*_VS15FamilyBooking.Designer.cs' -print -quit)"
          migration="$(find "$migration_dir" -maxdepth 1 -name '*_VS15FamilyBooking.cs' ! -name '*.Designer.cs' -print -quit)"

          test "$(find "$migration_dir" -maxdepth 1 -type f -name '*.cs' | wc -l)" -eq 3
          test -s "$snapshot"
          test -n "$designer" && test -s "$designer"
          test -n "$migration" && test -s "$migration"
          grep -Fq 'modelBuilder.Entity("NoorPath.FamilyBooking.Infrastructure.FamilyPartyRecord"' "$snapshot"
          grep -Fq 'ValueGeneratedOnAdd()' "$snapshot"
          grep -Fq '[Migration("' "$designer"

          dotnet ef migrations has-pending-model-changes \
            --project "$project" \
            --context FamilyBookingDbContext
          dotnet ef database update \
            --project "$project" \
            --context FamilyBookingDbContext
          dotnet ef migrations has-pending-model-changes \
            --project "$project" \
            --context FamilyBookingDbContext
          dotnet format NoorPath.slnx --no-restore
          git diff --check
      - name: Commit verified generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Modules/NoorPath.FamilyBooking.Infrastructure/Migrations
          git commit -m "Regenerate verified VS-15 EF migration"
          git push origin HEAD:codex/vs15-family-booking-mahram-runtime
