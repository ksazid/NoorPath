name: VS-27 generate booking migration

on:
  push:
    branches:
      - slice/vs27-departure-manifest-pilgrim-operations
    paths:
      - .github/workflows/vs27-generate-booking-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/vs27-departure-manifest-pilgrim-operations
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool install --global dotnet-ef --version 10.0.10
      - run: dotnet restore NoorPath.slnx
      - name: Build before migration
        run: dotnet build NoorPath.slnx --configuration Release --no-restore
      - name: Generate booking migration
        run: >-
          dotnet ef migrations add VS27DepartureManifest
          --context BookingDbContext
          --project src/Modules/NoorPath.Booking.Infrastructure/NoorPath.Booking.Infrastructure.csproj
          --startup-project apps/api/NoorPath.Api.csproj
          --output-dir Migrations
          --no-build
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Modules/NoorPath.Booking.Infrastructure/Migrations
          git commit -m "VS-27: add departure manifest migration"
          git push origin HEAD:slice/vs27-departure-manifest-pilgrim-operations
